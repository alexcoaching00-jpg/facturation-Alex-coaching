<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Générateur de Factures — Alex Coaching</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--ink:#0D0B0A; --ink2:#1D1714; --card:#1C1613; --red:#B01F1F; --red2:#7E1712; --grey:#A39588; --grey2:#6B5F55; --line:#2E2620; --white:#F2EDE7; --white2:#C9BCAF}
*{box-sizing:border-box; margin:0; padding:0}
body{
  background:linear-gradient(180deg,#12100E,#0D0B0A); color:var(--white); font-family:'Inter',sans-serif;
  padding:20px; min-height:100vh;
}
.container{max-width:1200px; margin:0 auto}
header{text-align:center; margin-bottom:40px; padding:20px 0; border-bottom:1px solid var(--line)}
h1{font-size:28px; margin-bottom:8px}
.subtitle{color:var(--grey2); font-size:14px}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:30px; margin-bottom:40px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px}
.panel h2{font-size:18px; margin-bottom:20px; color:var(--red); text-transform:uppercase; letter-spacing:.05em}
.form-group{margin-bottom:16px}
label{display:block; font-size:13px; font-weight:600; color:var(--grey2); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px}
input, select, textarea{
  width:100%; padding:12px 14px; background:var(--ink2); border:1px solid var(--line); border-radius:8px;
  color:var(--white); font-family:inherit; font-size:14px;
}
input:focus, select:focus, textarea:focus{outline:none; border-color:var(--red2)}
button{
  background:linear-gradient(180deg,var(--red),var(--red2)); color:white; padding:12px 20px; border:none;
  border-radius:8px; font-weight:600; cursor:pointer; font-size:14px; transition:filter .15s;
}
button:hover{filter:brightness(1.1)}
button:active{filter:brightness(0.95)}
.btn-secondary{background:var(--ink2); border:1px solid var(--line); color:var(--grey2)}
.btn-secondary:hover{background:var(--card)}
.factures-list{list-style:none}
.facture-item{
  background:var(--ink2); border:1px solid var(--line); border-radius:8px; padding:14px;
  margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:12px;
  font-size:13px;
}
.facture-info{flex:1}
.facture-num{font-weight:600; color:var(--red)}
.facture-date{color:var(--grey2); font-size:12px; margin-top:4px}
.facture-actions{display:flex; gap:8px}
.facture-actions button{padding:6px 12px; font-size:12px}
.preview{background:var(--ink); border:1px solid var(--line); border-radius:8px; padding:20px; max-height:600px; overflow-y:auto}
.invoice-header{text-align:center; margin-bottom:20px; padding-bottom:16px; border-bottom:2px solid var(--red)}
.invoice-header h3{font-size:16px; margin-bottom:4px}
.invoice-header p{font-size:12px; color:var(--grey2); margin:2px 0}
.invoice-content{font-size:12px}
.invoice-section{margin-bottom:16px}
.invoice-label{color:var(--grey2); font-weight:600; margin-bottom:4px; text-transform:uppercase; font-size:11px; letter-spacing:.04em}
.invoice-value{color:var(--white); margin-bottom:8px}
.invoice-table{width:100%; border-collapse:collapse; margin:12px 0}
.invoice-table th{background:var(--card); padding:8px; text-align:left; font-size:11px; color:var(--grey2); font-weight:600}
.invoice-table td{border-top:1px solid var(--line); padding:8px; font-size:12px}
.invoice-table .total{font-weight:600; color:var(--red)}
.status{font-size:12px; padding:8px 12px; border-radius:6px; display:inline-block; margin-top:12px}
.status.draft{background:rgba(160,102,40,.2); color:#FFB366}
.status.generated{background:rgba(34,139,34,.2); color:#66FF66}
.mt20{margin-top:20px}
</style>
</head>

        <label>Prix unitaire (€) *</label>
        <input id="price" type="number" step="0.01" required placeholder="40.00" />
      </div>

      <div class="form-group">
        <label>Date de la prestation</label>
        <input id="serviceDate" type="date" />
      </div>

      <div class="form-group">
        <label>Notes (optionnel)</label>
        <textarea id="notes" placeholder="Conditions de paiement, délais, etc..." rows="2"></textarea>
      </div>

      <button onclick="generateInvoice()">Générer la facture</button>
    </div>

    <!-- Aperçu + Liste -->
    <div>
      <div class="panel" style="margin-bottom:20px">
        <h2>Aperçu</h2>
        <div class="preview" id="preview">
          <p style="color:var(--grey2); text-align:center; padding:40px 0">Remplis le formulaire pour voir l'aperçu</p>
        </div>
        <div style="display:flex; gap:8px; margin-top:12px">
          <button onclick="downloadPDF()">⬇ PDF</button>
          <button onclick="downloadXML()" class="btn-secondary">⬇ E-facture XML</button>
        </div>
      </div>

      <div class="panel">
        <h2>Factures générées</h2>
        <ul class="factures-list" id="facturesList">
          <li style="color:var(--grey2); text-align:center; padding:20px">Aucune facture générée</li>
        </ul>
      </div>
    </div>
  </div>
</div>

<script>
const APP = {
  counter: parseInt(localStorage.getItem('invoice_counter')) || 1,
  invoices: JSON.parse(localStorage.getItem('invoices')) || [],

  saveSIRET() {
    localStorage.setItem('siret', document.getElementById('siret').value);
  },

  loadSIRET() {
    const siret = localStorage.getItem('siret');
    if (siret) document.getElementById('siret').value = siret;
  },

  getNextNumber() {
    const num = String(this.counter).padStart(3, '0');
    this.counter++;
    localStorage.setItem('invoice_counter', this.counter);
    return `2026-${num}`;
  },

  generateInvoiceData() {
    const siret = document.getElementById('siret').value || '[SIRET À COMPLÉTER]';
    const clientName = document.getElementById('clientName').value;
    const clientEmail = document.getElementById('clientEmail').value;
    const clientPhone = document.getElementById('clientPhone').value;
    const description = document.getElementById('description').value;
    const quantity = parseInt(document.getElementById('quantity').value) || 1;
    const price = parseFloat(document.getElementById('price').value) || 0;
    const serviceDate = document.getElementById('serviceDate').value || new Date().toISOString().split('T')[0];
    const notes = document.getElementById('notes').value;

    const number = this.getNextNumber();
    const today = new Date().toISOString().split('T')[0];
    const total = quantity * price;

    return {
      number, today, serviceDate, siret, clientName, clientEmail, clientPhone,
      description, quantity, price, total, notes
    };
  },

  saveToDB(invoice) {
    this.invoices.push({...invoice, id: Date.now()});
    localStorage.setItem('invoices', JSON.stringify(this.invoices));
    this.refreshList();
  },

  refreshList() {
    const list = document.getElementById('facturesList');
    if (this.invoices.length === 0) {
      list.innerHTML = '<li style="color:var(--grey2); text-align:center; padding:20px">Aucune facture générée</li>';
      return;
    }
    list.innerHTML = this.invoices.map(inv => `
      <li class="facture-item">
        <div class="facture-info">
          <div class="facture-num">${inv.number}</div>
          <div class="facture-date">${inv.clientName} • ${inv.total.toFixed(2)} €</div>
        </div>
        <div class="facture-actions">
          <button onclick="APP.downloadInvoicePDF(${inv.id})" style="padding:6px 10px; font-size:12px">PDF</button>
          <button onclick="APP.downloadInvoiceXML(${inv.id})" class="btn-secondary" style="padding:6px 10px; font-size:12px">XML</button>
          <button onclick="APP.deleteInvoice(${inv.id})" class="btn-secondary" style="padding:6px 10px; font-size:12px">✕</button>
        </div>
      </li>
    `).join('');
  },

  downloadInvoicePDF(id) {
    const inv = this.invoices.find(i => i.id === id);
    if (!inv) return;
    this.downloadPDFFromData(inv);
  },

  downloadInvoiceXML(id) {
    const inv = this.invoices.find(i => i.id === id);
    if (!inv) return;
    this.downloadXMLFromData(inv);
  },

  deleteInvoice(id) {
    if (!confirm('Supprimer cette facture ?')) return;
    this.invoices = this.invoices.filter(i => i.id !== id);
    localStorage.setItem('invoices', JSON.stringify(this.invoices));
    this.refreshList();
  },

  downloadPDFFromData(invoice) {
    const element = document.getElementById('preview');
    const opt = {
      margin: 10,
      filename: `facture-${invoice.number.replace('/', '-')}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(element).save();
  },

  downloadXMLFromData(invoice) {
    const xml = this.generateFacturX(invoice);
    const blob = new Blob([xml], { type: 'application/xml' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `facture-${invoice.number.replace('/', '-')}.xml`;
    link.click();
  }
};

function generateInvoice() {
  const invoice = APP.generateInvoiceData();
  APP.updatePreview(invoice);
  APP.saveToDB(invoice);
}

function downloadPDF() {
  const preview = document.getElementById('preview');
  const num = preview.querySelector('.facture-num')?.textContent || 'facture';
  const opt = {
    margin: 10,
    filename: `facture-${num.replace('/', '-')}.pdf`,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };
  html2pdf().set(opt).from(preview).save();
}

function downloadXML() {
  if (APP.invoices.length === 0) {
    alert('Génère d\'abord une facture');
    return;
  }
  const last = APP.invoices[APP.invoices.length - 1];
  APP.downloadXMLFromData(last);
}
