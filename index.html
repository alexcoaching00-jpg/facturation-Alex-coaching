      return `<div class="cmp" style="margin-bottom:14px">
        <div class="cmp-wrap">
          <img src="${b2.url}" alt="Après" class="cmp-after">
          <div class="cmp-before" id="cmp-clip"><img src="${a.url}" alt="Avant"></div>
          <div class="cmp-handle" id="cmp-handle"><span class="cmp-grip">↔</span></div>
          <span class="cmp-tag cmp-tag-a">Avant · ${frDate(a.date)}</span>
          <span class="cmp-tag cmp-tag-b">Après · ${frDate(b2.date)}</span>
        </div>
        <input type="range" id="cmp-range" min="0" max="100" value="50" aria-label="Comparer avant et après" style="width:100%;margin-top:12px;accent-color:var(--red)">
        <p class="muted" style="font-size:11.5px;text-align:center;margin-top:4px">Glisse pour comparer</p>
      </div>`;})():"")
    +photosTab(c,editable);
}

/* ===== PHOTOS BILAN ===== */
function photosTab(c,editable){
  const photos=(c.photos||[]);
  const carte=(p,i)=>`
    <div class="photo-item">
      <img src="${p.url}" alt="Bilan ${i+1}" loading="lazy">
      ${editable?`<button class="photo-del" data-act="del-photo" data-idx="${i}">×</button>`:""}
      <div class="photo-label">${esc(p.label||frDate(p.date))}</div>
    </div>`;
  // On garde l'index d'origine : les boutons de suppression doivent viser la bonne photo
  const parType=t=>photos.map((p,i)=>[p,i]).filter(([p])=>(p.type||"suivi")===t);
  const avant=parType("avant"), apres=parType("apres"), suivi=parType("suivi");
  const addBtn=editable?`
    <label class="photo-add" title="Ajouter une photo">
      <span>+</span>
      <input type="file" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;left:-9999px" data-act="add-photo">
    </label>`:"";
  const bloc=(titre,couleur,liste,avecAdd)=>
    (liste.length||avecAdd)
      ? `<div class="sec-head" style="margin-top:10px"><h2 style="font-size:15px;color:${couleur};letter-spacing:.06em">${titre}</h2></div>
         <div class="photo-grid">${liste.map(([p,i])=>carte(p,i)).join("")}${avecAdd?addBtn:""}</div>`
      : "";
  // Comparaison directe : la dernière "avant" face à la dernière "après"
  const comparo=(avant.length&&apres.length)?(()=>{
    const a=avant[avant.length-1][0], b=apres[apres.length-1][0];
    return `<div class="panel" style="margin-bottom:14px">
      <div class="ph" style="font-size:13px">↔ Comparaison</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div><img src="${a.url}" alt="Avant" loading="lazy" style="width:100%;border-radius:10px;border:1px solid var(--line);display:block">
          <p style="text-align:center;font-size:11.5px;color:var(--grey);margin:5px 0 0">AVANT · ${esc(frDate(a.date))}</p></div>
        <div><img src="${b.url}" alt="Après" loading="lazy" style="width:100%;border-radius:10px;border:1px solid var(--red);display:block">
          <p style="text-align:center;font-size:11.5px;color:var(--amber);margin:5px 0 0">APRÈS · ${esc(frDate(b.date))}</p></div>
      </div></div>`;
  })():"";
  if(!photos.length&&!editable) return vide("📷","Pas encore de photo","Les photos de progression apparaîtront ici.");
  return comparo
    + bloc("AVANT","var(--grey)",avant,false)
    + bloc("APRÈS","var(--red)",apres,false)
    + bloc(suivi.length?"SUIVI":"AJOUTER UNE PHOTO","var(--grey2)",suivi,editable);
}

/* ===== actions async ===== */
async function doAuth(mode){
  const email=val("au-email").trim(), pw=val("au-pw");
  if(!email||!pw){ S.authErr="Renseignez e-mail et mot de passe."; render(); return; }
  if(mode==="signup"){
    const pw2=val("au-pw2");
    if(pw!==pw2){ S.authErr="Les deux mots de passe ne correspondent pas."; render(); return; }
    if(pw.length<8){ S.authErr="Le mot de passe doit faire au moins 8 caractères."; render(); return; }
  }
  S.authErr=""; S.authBusy=true; render();
  let data, error;
  if(mode==="signup"){
    // Contrôle d'accès : seules les adresses invitées par le coach peuvent créer un compte

/* Import de sauvegarde : recrée les clients absents (par nom), sans écraser l'existant */
async function importBackupData(arr){
  if(!Array.isArray(arr)) return {added:0,skipped:0,failed:0,bad:true};
  const existing=new Set(S.clients.map(c=>(c.nom||"").trim().toLowerCase()));
  let added=0,skipped=0,failed=0;
  for(const raw of arr){
    const nom=(raw.nom||"").trim();
    if(!nom){ failed++; continue; }
    if(existing.has(nom.toLowerCase())){ skipped++; continue; }
    const {data,error}=await sb.from("clients").insert(baseRow(raw)).select().single();
    if(error||!data){ failed++; continue; }
    const full={...raw,id:data.id};
    await sb.from("clients").update(lightRow(full)).eq("id",data.id).then(({error:e2})=>{ if(e2) schemaHint(e2); });
    S.clients.push(full);
    existing.add(nom.toLowerCase());
    added++;
  }
  return {added,skipped,failed};
}


/* Réordonne les exercices d'une séance selon une liste d'identifiants.
   Sert au glisser-déposer : on lit l'ordre final affiché puis on l'applique
   au tableau, sans toucher aux exercices des autres séances. */
function reordonnerBloc(arr,bloc,idsDansLOrdre){
  const positions=[];                 // indices occupés par ce bloc dans le tableau global
  arr.forEach((e,i)=>{ if((e.bloc||"")===(bloc||"")) positions.push(i); });
  const parId={};
  arr.forEach(e=>{ if((e.bloc||"")===(bloc||"")) parId[e.id]=e; });
  // On ne garde que les ids réellement connus, puis on complète avec les oubliés
  const ordonnes=idsDansLOrdre.map(id=>parId[id]).filter(Boolean);
  positions.forEach(i=>{ if(!ordonnes.includes(arr[i])) ordonnes.push(arr[i]); });
  if(ordonnes.length!==positions.length) return false;
  positions.forEach((pos,k)=>{ arr[pos]=ordonnes[k]; });
  return true;
}
function swapExInBloc(arr,id,dir){
  const item=arr.find(e=>e.id===id); if(!item) return false;
  const bloc=item.bloc||"";
  const idxs=arr.map((e,i)=>({e,i})).filter(x=>(x.e.bloc||"")===bloc).map(x=>x.i);
  const pos=idxs.findIndex(i=>arr[i].id===id); if(pos<0) return false;
  const swapPos=pos+dir; if(swapPos<0||swapPos>=idxs.length) return false;
  const a=idxs[pos], b=idxs[swapPos];
  const tmp=arr[a]; arr[a]=arr[b]; arr[b]=tmp;
  return true;
}

/* ===== GLISSER-DÉPOSER DES EXERCICES (appui long) =====
   iOS ne gère pas le drag-and-drop HTML5 au doigt : on le reconstruit avec les
   événements tactiles. Appui maintenu ~420 ms sur une carte, puis on déplace le
   doigt ; la carte survolée cède sa place en direct. Un simple glissement sans
   pause reste un défilement normal. */
const DRAG={actif:false,el:null,bloc:"",timer:null,y0:0,x0:0,baseY:0};
function dragAnnulerAttente(){ if(DRAG.timer){ clearTimeout(DRAG.timer); DRAG.timer=null; } }
function dragDemarrer(el,y){
  DRAG.actif=true; DRAG.el=el; DRAG.bloc=el.dataset.exbloc||""; DRAG.baseY=y;
  el.classList.add("xdrag");
  el.style.transform="scale(1.03)";
  document.body.classList.add("xdragging");
  try{ if(navigator.vibrate) navigator.vibrate(30); }catch(_){}
  toast("Déplace l'exercice, relâche pour valider");
}
function dragTerminer(){
  if(!DRAG.actif){ dragAnnulerAttente(); return; }
  const el=DRAG.el, bloc=DRAG.bloc;
  DRAG.actif=false; DRAG.el=null; DRAG.timer=null;
  if(el){ el.classList.remove("xdrag"); el.style.transform=""; }
  document.body.classList.remove("xdragging");
  const ids=[...document.querySelectorAll('.xcard[data-exid]')]
    .filter(n=>(n.dataset.exbloc||"")===bloc)
    .map(n=>n.dataset.exid);
  // Modèle en cours d'édition : aucun client n'est sélectionné, on réordonne
  // le modèle et on conserve le nom éventuellement saisi dans le champ.
  if(S.tplEdit){
    reordonnerBloc(S.tplEdit.program,bloc,ids);
    const n=val("tpl-nom"); if(n) S.tplEdit.nom=n;
    render();
    toast("Ordre modifié — pense à enregistrer le modèle");
    return;
  }
  const c=sel(); if(!c) { render(); return; }
  if(!reordonnerBloc(c.program,bloc,ids)){ render(); return; }
  save();
  patchField(c,"program",err=>toast(err?"Erreur d'enregistrement":"Ordre enregistré"));
  render();
}
/* Saisie par la poignée ⠿ : démarrage immédiat, sans appui long.
   C'est la méthode fiable sur iPhone — l'appui long entre en concurrence avec
   le défilement et avec les gestes natifs du système. Le listener doit être
   non passif pour pouvoir bloquer le défilement dès le premier contact. */
document.addEventListener("touchstart",e=>{
  const grip=e.target.closest&&e.target.closest(".xgrip");
  if(!grip) return;
  const carte=grip.closest(".xcard[data-exid]"); if(!carte) return;
  e.preventDefault();
  dragAnnulerAttente();
  dragDemarrer(carte,e.touches[0].clientY);
},{passive:false});
document.addEventListener("touchstart",e=>{
  const carte=e.target.closest&&e.target.closest(".xcard[data-exid]");
  // Pas de glisser depuis un bouton : on ne veut pas gêner ▲▼, ✎, vidéo…
  if(!carte||e.target.closest("button,a,input,select,textarea")) return;
  if(S.isClient) return;                    // réordonner reste une action du coach
  const t=e.touches[0]; DRAG.y0=t.clientY; DRAG.x0=t.clientX;
  dragAnnulerAttente();
  DRAG.timer=setTimeout(()=>dragDemarrer(carte,DRAG.y0),400);
},{passive:true});
document.addEventListener("touchmove",e=>{
  const t=e.touches[0];
  if(!DRAG.actif){
    // Mouvement franc avant la fin de l'appui : c'est un défilement, on abandonne.
    // Seuil généreux (16 px) car le doigt bouge toujours un peu pendant l'appui.
    if(DRAG.timer && (Math.abs(t.clientY-DRAG.y0)>16||Math.abs(t.clientX-DRAG.x0)>16)) dragAnnulerAttente();
    return;
  }
  e.preventDefault();                        // empêche la page de défiler pendant le glisser
  // La carte suit le doigt : sans ça, rien ne semblait bouger
  DRAG.el.style.transform="translateY("+(t.clientY-DRAG.baseY)+"px) scale(1.03)";
  const sous=document.elementFromPoint(t.clientX,t.clientY);
  const cible=sous&&sous.closest?sous.closest(".xcard[data-exid]"):null;
  if(!cible||cible===DRAG.el) return;
  if((cible.dataset.exbloc||"")!==DRAG.bloc) return;   // pas de transfert entre séances
  const r=cible.getBoundingClientRect();
  const avant=t.clientY<r.top+r.height/2;
  cible.parentNode.insertBefore(DRAG.el,avant?cible:cible.nextSibling);
  // La carte vient de changer de place dans le flux : on repart de la position
  // actuelle du doigt, sinon elle ferait un saut visuel.
  DRAG.baseY=t.clientY;
  DRAG.el.style.transform="scale(1.03)";
},{passive:false});
document.addEventListener("touchend",dragTerminer,{passive:true});
document.addEventListener("touchcancel",()=>{ dragAnnulerAttente(); if(DRAG.actif) dragTerminer(); },{passive:true});

/* Équivalent souris, pour le MacBook. */
document.addEventListener("mousedown",e=>{
  const grip=e.target.closest&&e.target.closest(".xgrip");
  if(!grip) return;
  const carte=grip.closest(".xcard[data-exid]"); if(!carte) return;
  e.preventDefault();
  dragDemarrer(carte,e.clientY);
  const bouger=ev=>{
    if(!DRAG.actif) return;
    DRAG.el.style.transform="translateY("+(ev.clientY-DRAG.baseY)+"px) scale(1.03)";
    const sous=document.elementFromPoint(ev.clientX,ev.clientY);
    const cible=sous&&sous.closest?sous.closest(".xcard[data-exid]"):null;
    if(!cible||cible===DRAG.el) return;
    if((cible.dataset.exbloc||"")!==DRAG.bloc) return;
    const r=cible.getBoundingClientRect();
    cible.parentNode.insertBefore(DRAG.el,ev.clientY<r.top+r.height/2?cible:cible.nextSibling);
    DRAG.baseY=ev.clientY;
    DRAG.el.style.transform="scale(1.03)";
  };
  const lacher=()=>{
    document.removeEventListener("mousemove",bouger);
    document.removeEventListener("mouseup",lacher);
    dragTerminer();
  };
  document.addEventListener("mousemove",bouger);
  document.addEventListener("mouseup",lacher);
});

document.addEventListener("input",e=>{

    render();
    const el4=document.getElementById(id);

    return;
  }
  const ef=e.target.closest("[data-exofilter]");
  if(ef){
    const wrap=ef.closest(".exopicker"); if(!wrap) return;
    const mode=S.exoMode||"salle", q=ef.value;
    const sel2=wrap.querySelector("select");
    if(sel2) sel2.innerHTML=pickerOptionsHtml(mode,q);
    const cnt=wrap.querySelector(".exopicker-count"); if(cnt) cnt.textContent=pickerCount(mode,q);
    renderExoResults(wrap);

    const b=e.target.parentElement.querySelector("b"); if(b) b.textContent=e.target.value+" %";

    clearTimeout(window.__volPrev);
    window.__volPrev=setTimeout(()=>{ alarm(1); },420);
    return;
  }
  if(e.target.id==="cmp-range"){
    const v=e.target.value;
    const clip=document.getElementById("cmp-clip"), hd=document.getElementById("cmp-handle");
    if(clip) clip.style.width=v+"%";

    S.exoFind=e.target.value; const pos=e.target.selectionStart; render();

    return;

  const trIn=e.target.closest("[data-act=\"set-tour-repos\"]");

    return;

  const trInTpl=e.target.closest("[data-act=\"set-tour-repos-tpl\"]");
  if(trInTpl){
    if(!S.tplEdit) return;
    S.tplEdit.seanceTourRepos=S.tplEdit.seanceTourRepos||{};
    if(trInTpl.value.trim()) S.tplEdit.seanceTourRepos[trInTpl.dataset.jour]=trInTpl.value.trim(); else delete S.tplEdit.seanceTourRepos[trInTpl.dataset.jour];
    return;
  }
  const rdIn=e.target.closest("[data-act=\"set-seance-rounds\"]");
  if(rdIn){
    const c=sel(); if(!c) return;
    c.seanceRounds=c.seanceRounds||{};
    const n=parseInt(rdIn.value)||0;
    if(n>0) c.seanceRounds[rdIn.dataset.jour]=n; else delete c.seanceRounds[rdIn.dataset.jour];

document.addEventListener("change",e=>{

    S.detailTab=e.target.value; render();
    if(S.detailTab==="messages") reloadKeepingView();
    return;
  }
  if(e.target.id==="tst-id"){ S.tstSel=e.target.value; render(); return; }

  const trBlur=e.target.closest("[data-act=\"set-tour-repos\"]");

      c.seanceTourRepos=c.seanceTourRepos||{};
      const j=trBlur.dataset.jour, nv=normDuree(trBlur.value);
      if(nv) c.seanceTourRepos[j]=nv; else delete c.seanceTourRepos[j];
      patchField(c,"seanceTourRepos",()=>{ setTimeout(render,0); });
    } return; }
  const trBlurTpl=e.target.closest("[data-act=\"set-tour-repos-tpl\"]");
  if(trBlurTpl){ if(S.tplEdit){
      S.tplEdit.seanceTourRepos=S.tplEdit.seanceTourRepos||{};
      const j2=trBlurTpl.dataset.jour, nv2=normDuree(trBlurTpl.value);
      if(nv2) S.tplEdit.seanceTourRepos[j2]=nv2; else delete S.tplEdit.seanceTourRepos[j2];
    } setTimeout(render,0); return; }
  const rdBlur=e.target.closest("[data-act=\"set-seance-rounds\"]");
  if(rdBlur){ const c=sel(); if(c){ patchField(c,"seanceRounds",()=>{ setTimeout(render,0); }); } return; }
  const rdBlurTpl=e.target.closest("[data-act=\"set-seance-rounds-tpl\"]");
  if(rdBlurTpl){ toast("Nombre de tours mis à jour"); setTimeout(render,0); return; }
  const stSel=e.target.closest("[data-act=\"set-seance-type\"]");
  if(stSel){
    const c=sel(); if(!c) return;
    c.seanceTypes=c.seanceTypes||{};
    const jour=stSel.dataset.jour, v=stSel.value;
    // On conserve le format WOD éventuellement déjà réglé sur cette séance
    const f=seanceFormat(c,jour);
    const suffixe=f.mode?("|"+f.mode+":"+f.val):"";
    if(v||suffixe) c.seanceTypes[jour]=v+suffixe; else delete c.seanceTypes[jour];
    patchField(c,"seanceTypes",err=>toast(err?"Erreur":"Type de séance enregistré"));
    return;
  }
  // Format WOD : AMRAP / EMOM / For Time
  const fmSel=e.target.closest("[data-act=\"set-format\"]");
  if(fmSel){
    const c=sel(); if(!c) return;
    const jour=fmSel.dataset.jour;
    const actuel=seanceFormat(c,jour);
    const defaut={amrap:12,emom:10,fortime:5}[fmSel.value]||0;
    setSeanceFormat(c,jour,fmSel.value,actuel.val||defaut);
    patchField(c,"seanceTypes",err=>toast(err?"Erreur":"Format enregistré"));
    setTimeout(render,0);
    return;
  }
  const fvIn=e.target.closest("[data-act=\"set-format-val\"]");
  if(fvIn){
    const c=sel(); if(!c) return;
    const jour=fvIn.dataset.jour;
    const f=seanceFormat(c,jour);
    setSeanceFormat(c,jour,f.mode,Math.max(1,parseInt(fvIn.value)||1));
    patchField(c,"seanceTypes",err=>toast(err?"Erreur":"Enregistré"));

          let w=img.naturalWidth, h=img.naturalHeight;

          const ctx=cv.getContext("2d");
          ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h); // fond blanc pour JPEG

          resolve(cv.toDataURL("image/jpeg",0.82));

function setupPWA(){
  try{
    // Favicon = logo
    const fav=document.createElement("link"); fav.rel="icon"; fav.href=LOGO; document.head.appendChild(fav);
    // Manifest : fichier manifest.json réel (icônes fiables sur l'écran d'accueil)
    // Service worker : active le vrai bouton "Installer" natif (Android/Chrome) + résistance hors-ligne
    if("serviceWorker" in navigator){
      window.addEventListener("load",async()=>{
        try{
          const reg=await navigator.serviceWorker.register("./sw.js");
          // Force la recherche d'une nouvelle version à chaque chargement
          try{ await reg.update(); }catch(_){}
          // Si un SW est déjà en attente d'activation, on lui demande de se lancer tout de suite
          // Activation immédiate d'un SW en attente : uniquement au démarrage.
          // Le faire en cours d'utilisation déclenchait un rechargement surprise.
          if(reg.waiting && (Date.now()-BOOT_TS)<4000){ reg.waiting.postMessage({type:"SKIP_WAITING"}); }
          reg.addEventListener("updatefound",()=>{
            const sw=reg.installing;
            if(!sw) return;
            sw.addEventListener("statechange",()=>{
              if(sw.state==="installed"&&navigator.serviceWorker.controller){
                // Nouvelle version prête : on prévient l'utilisateur (banner discret)
                if(!document.getElementById("upd-banner")){
                  const b=document.createElement("div");
                  b.id="upd-banner";
                  b.style.cssText="position:fixed;top:calc(env(safe-area-inset-top, 0px) + 12px);left:12px;right:12px;max-width:400px;margin:0 auto;z-index:9999;background:linear-gradient(180deg,#CE2A2A,#8E1815);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.4);cursor:pointer;font-family:'Inter';text-align:center";
                  b.textContent="🔄 Nouvelle version — appuyer pour recharger";
                  b.onclick=()=>{ if(reg.waiting) reg.waiting.postMessage({type:"SKIP_WAITING"}); location.reload(); };
                  document.body.appendChild(b);
                  // Auto-hide au bout de 20s pour ne pas gêner
                  setTimeout(()=>{ const el=document.getElementById("upd-banner"); if(el) el.style.opacity="0.4"; },20000);
                }
              }
            });
          });
          // Recharger seulement dans les premières secondes après le lancement.
          // Un rechargement en cours d'utilisation repart sur une session neuve et
          // fait perdre les autorisations déjà accordées (micro notamment) — iOS
          // les redemandait alors à chaque vocal. Passé ce délai, on propose la
          // mise à jour via la bannière plutôt que de l'imposer.
          let refreshing=false;
          navigator.serviceWorker.addEventListener("controllerchange",()=>{
            if(refreshing) return;
            const auDemarrage=(Date.now()-BOOT_TS)<4000;
            const occupe=(typeof WK!=="undefined"&&WK.on)||(typeof REC!=="undefined"&&REC.rec&&REC.rec.state==="recording");
            if(auDemarrage && !occupe){ refreshing=true; location.reload(); return; }
            const b=document.getElementById("upd-banner");
            if(b) b.style.opacity="1";
          });
          // Bump de version détecté côté client : on purge les caches pour repartir propre
          try{
            const stored=localStorage.getItem("appVersion");
            if(stored&&stored!==APP_VERSION&&window.caches){
              const keys=await caches.keys();
              await Promise.all(keys.map(k=>caches.delete(k)));
            }
            localStorage.setItem("appVersion",APP_VERSION);
          }catch(_){}
        }catch(_){}
      });
    }
  }catch(e){}
}

const VAPID_PUBLIC_KEY="BEbeggfphArywGs2yMlEvdrsFq1bmznF4DqXETjcg6GFM1t_bjk2d-NsIoch2rdO_yXyP3mSbnoGtAPmT9iUSgs";
function urlB64ToUint8Array(base64String){
  const padding="=".repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,"+").replace(/_/g,"/");
  const raw=atob(base64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
let PUSH_SUBSCRIBED=false;
async function subscribeToPush(){
  if(!sb||!S.session) return;
  try{
    if(!("serviceWorker" in navigator)||!("PushManager" in window)) return;
    if(!("Notification" in window)||Notification.permission!=="granted") return;
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    // Si la subscription existante a expiré ou été invalidée (ex. après une mise à jour du SW),
    // on la révoque et on en recrée une nouvelle. C'est la cause la plus courante de
    // "je ne reçois plus les notifications" après une nouvelle version.
    if(sub){
      const exp=sub.expirationTime;
      if(exp&&exp<Date.now()){ try{ await sub.unsubscribe(); }catch(_){} sub=null; }
    }
    if(!sub){
      try{
        sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8Array(VAPID_PUBLIC_KEY)});
      }catch(e){ console.warn("[Push] Échec subscribe:",e); return; }
    }
    const j=sub.toJSON();
    const myMail=((S.session&&S.session.user&&S.session.user.email)||"").toLowerCase();
    // Upsert : si l'endpoint existe on met à jour les clés/email, sinon on insère
    const {data:existing}=await sb.from("push_subscriptions").select("id").eq("endpoint",j.endpoint);
    if(!existing||!existing.length){
      const {error}=await sb.from("push_subscriptions").insert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth_key:j.keys.auth,email:myMail});
      if(error) console.warn("[Push] Insert:",error);
    } else {
      // Assure que l'email associé est à jour (ex. si le compte a changé)
      await sb.from("push_subscriptions").update({p256dh:j.keys.p256dh,auth_key:j.keys.auth,email:myMail}).eq("endpoint",j.endpoint);
    }
    PUSH_SUBSCRIBED=true;
    console.log("[Push] Abonnement OK pour",myMail);
  }catch(e){ console.warn("[Push] Erreur globale:",e); }
}

/* Prioriser la musique de fond (Spotify/Apple Music) :
   Si activé, on n'utilise pas le son silencieux qui garde l'app active en arrière-plan.
   Conséquence : la musique continue mais l'alarme de fin de repos passe par une push
   notification iOS au lieu du son local.
   IMPORTANT : ce mode est réservé au coach. Le client a toujours l'alarme audio fiable,
   car il en a besoin pendant sa vraie séance d'entraînement. */
/* Mode audio de la séance — trois comportements :
   • "alarme"  : son de maintien en continu. L'alarme sonne même écran verrouillé,
                 mais la musique de fond est coupée pendant toute la séance.
   • "musique" : pas de son de maintien. Spotify / Apple Music joue en continu et
                 n'est interrompu que ~2 s au moment du bip, puis reprend tout seul.
                 Écran verrouillé, c'est la notification push qui prend le relais.
   • "silence" : aucun son local, uniquement les notifications push. */
function audioMode(){
  const m=localStorage.getItem("audio_mode");
  if(m==="alarme"||m==="musique"||m==="silence") return m;
  // Reprise de l'ancien réglage binaire pour ne rien perdre
  return localStorage.getItem("musique_fond")==="1"?"silence":"alarme";
}
function musiqueFondOn(){
  // Conservé : « la musique doit être préservée » couvre les modes musique et silence
  return audioMode()!=="alarme";
}
/* Suivi de la notification de repos programmée, pour pouvoir l'annuler. */
const PUSH_SCHED={id:null,interval:null,timeout:null};
function schedulePush(title,body,secs){
  try{
    // Actif dans 3 cas : côté client (toujours), coach avec repos-notif activé, ou coach avec "musique de fond"
    // (car alors l'alarme audio est désactivée => la push devient l'unique moyen d'être prévenu)
    if(!S.isClient && !reposNotifOn() && !musiqueFondOn()) return;
    if(!sb||!S.session) return;
    const me=((S.session.user&&S.session.user.email)||"").toLowerCase();
    const sendAt=new Date(Date.now()+secs*1000).toISOString();
    // On annule d'abord une éventuelle push encore programmée (repos précédent)
    cancelScheduledPush();
    sb.from("scheduled_pushes").insert({title,body:body||"",send_at:sendAt,target_email:me})
      .select().single().then(({data})=>{ if(data&&data.id) PUSH_SCHED.id=data.id; });
    // Plusieurs tentatives de flush pour couvrir les cas où l'app reste ouverte :
    // - immédiate (ping du worker pour qu'il connaisse la push)
    // - toutes les 20 s (rattrapage tant que l'app est active)
    // - dernière tentative juste après l'échéance
    try{ flushPushes(); }catch(_){}
    PUSH_SCHED.interval=setInterval(()=>{ try{ flushPushes(); }catch(_){} },20000);
    PUSH_SCHED.timeout=setTimeout(()=>{
      if(PUSH_SCHED.interval){ clearInterval(PUSH_SCHED.interval); PUSH_SCHED.interval=null; }
      PUSH_SCHED.timeout=null; PUSH_SCHED.id=null;
      try{ flushPushes(); }catch(_){}
    }, Math.max(500, secs*1000 + 1000));
  }catch(e){}
}

    if(h.includes("access_token=")){
      const p=new URLSearchParams(h.replace(/^#/,""));
      const at=p.get("access_token"), rt=p.get("refresh_token"), type=p.get("type");
      history.replaceState(null,"",location.pathname+location.search);
      if(at){
        S.loading=true; render();
        sb.auth.setSessionFromTokens(at,rt).then(({error})=>{
          if(error){ S.loading=false; S.authErr=error.message; render(); return; }
          if(type==="recovery"){ S.recoverMode=true; S.loading=false; render(); return; }
          // Lien de connexion : le compte existe mais n'a pas de mot de passe → on le fait choisir
          if(type==="magiclink"||type==="invite"||type==="signup"){ S.setPwMode=true; S.loading=false; render(); return; }
        });
        return;
      }
    }
    const errDesc=(location.hash.match(/error_description=([^&]+)/)||[])[1];
    if(errDesc){ history.replaceState(null,"",location.pathname+location.search);
      S.authErr=decodeURIComponent(errDesc.replace(/\+/g," ")); }
  }catch(e){}
  try{ const dl=document.getElementById("exos-fr"); if(dl){ const all=[...new Set([].concat(...EXOS_GROUPES.map(g=>g[1]),...EXOS_MAISON.map(g=>g[1])))]; dl.innerHTML=all.map(e=>`<option value="${e}"></option>`).join(""); } }catch(e){}
  const spImg=document.getElementById('splash-img'); if(spImg) spImg.src=LOGO;
  sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  render();
  sb.auth.onAuthStateChange((_evt,session)=>{
    S.session=session||null;
    if(session){ loadClients(); }
    else {
      // Déconnexion : on repart d'un état propre, sinon un écran de blocage
      // (accès suspendu, choix de mot de passe…) resterait affiché
      S.clients=[]; S.isClient=false; S.role="coach";
      S.recoverMode=false; S.setPwMode=false; S.accessEnded=false; S.notActivated=false;
      S.authErr=""; S.authBusy=false; S.selectedId=null; S.view="dashboard"; S.q="";
      render();
    }
  });
  // Rafraîchit automatiquement les messages toutes les 8 s quand on est dans l'onglet Messages
  // MAIS : on saute le refresh si un vocal est en cours de lecture, sinon le render()
  // remplace l'élément <audio> dans le DOM et la lecture est coupée net.
  setInterval(()=>{
    const onMsg=(S.isClient && S.clientTab==="messages") || (!S.isClient && S.view==="detail" && S.detailTab==="messages");
    if(!onMsg||!S.session) return;
    const voxJoue=Array.from(document.querySelectorAll(".voice-msg audio")).some(a=>!a.paused&&!a.ended);
    if(voxJoue) return; // ne pas interrompre une lecture en cours
    reloadKeepingView();
  }, 8000);
}
bootApp();
</script>
