/* ===== DIAGNOSTIC NOTIFICATIONS : dit précisément ce qui bloque ===== */
async function diagPush(){
  const L=[];
  const add=(ok,txt,fix)=>L.push({ok,txt,fix:fix||""});
  // 1. Mode application (obligatoire sur iPhone)
  const iOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
  const standalone=window.navigator.standalone===true||window.matchMedia("(display-mode: standalone)").matches;
  add(!iOS||standalone, iOS?("Appli ouverte depuis l'icône : "+(standalone?"oui":"NON")):"Appareil : Android/PC (pas de restriction)",
      "Sur iPhone : Safari → Partager → « Sur l'écran d'accueil », puis ouvrir par l'icône.");
  // 2. Autorisation
  const perm=(window.Notification&&Notification.permission)||"absent";
  add(perm==="granted","Autorisation notifications : "+perm,
      perm==="denied"?"Refusée : Réglages iPhone → Notifications → Alex Coaching → Autoriser.":"Appuie sur un bouton de l'appli pour déclencher la demande.");
  // 3. Service worker : le fichier sw.js doit être en ligne
  let swOk=false, swMsg="non supporté";
  if("serviceWorker" in navigator){
    try{
      const r=await fetch("./sw.js",{cache:"no-store"});
      const ct=(r.headers.get("content-type")||"");
      if(!r.ok) swMsg="fichier sw.js absent (erreur "+r.status+")";
      else if(ct.includes("text/html")) swMsg="sw.js introuvable (page HTML renvoyée)";
      else { swMsg="fichier sw.js présent"; swOk=true; }
    }catch(e){ swMsg="sw.js inaccessible"; }
  }
  add(swOk,"Fichier sw.js : "+swMsg,"Envoie le fichier sw.js à la racine de ton dépôt GitHub, à côté d'index.html.");
  // 4. Service worker actif
  let regOk=false, regMsg="—";
  if(swOk){
    try{
      const reg=await Promise.race([navigator.serviceWorker.ready,new Promise(r=>setTimeout(()=>r(null),4000))]);
      if(reg){ regOk=true; regMsg="actif"; } else regMsg="ne démarre pas (délai dépassé)";
    }catch(e){ regMsg="erreur : "+e.message; }
  } else regMsg="impossible sans sw.js";
  add(regOk,"Service worker : "+regMsg,"Ferme complètement l'appli et rouvre-la après avoir mis sw.js en ligne.");
  // 5. Abonnement push
  let subOk=false, subMsg="—", endpoint="";
  if(regOk&&perm==="granted"&&("PushManager" in window)){
    try{
      const reg=await navigator.serviceWorker.ready;
      let sub=await reg.pushManager.getSubscription();
      if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8Array(VAPID_PUBLIC_KEY)});
      endpoint=sub.toJSON().endpoint||""; subOk=true; subMsg="obtenu";
    }catch(e){ subMsg="refusé : "+(e.message||e.name); }
  } else subMsg="conditions précédentes non remplies";
  add(subOk,"Abonnement de l'appareil : "+subMsg,"Vérifie iOS 16.4 minimum (Réglages → Général → Informations).");
  // 6. Enregistrement en base
  let dbOk=false, dbMsg="—";
  if(subOk&&sb&&S.session){
    try{
      const reg=await navigator.serviceWorker.ready;
      const j=(await reg.pushManager.getSubscription()).toJSON();
      const mail=((S.session.user&&S.session.user.email)||"").toLowerCase();
      const {error}=await sb.from("push_subscriptions").insert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth_key:j.keys.auth,email:mail});
      if(error){
        if(/duplicate|unique/i.test(error.message||"")){ dbOk=true; dbMsg="déjà enregistré ✓"; }
        else dbMsg="refusé par Supabase : "+error.message;
      } else { dbOk=true; dbMsg="enregistré ✓"; }
    }catch(e){ dbMsg="erreur : "+(e.message||"inconnue"); }
  } else dbMsg="conditions précédentes non remplies";
  add(dbOk,"Enregistrement dans Supabase : "+dbMsg,"Table manquante ou règle de sécurité : relance le script SQL des notifications.");
  return {L,endpoint};
}

/* ===== FORMATS DE SÉANCE (WOD) =====
   Le format est encodé dans seanceTypes après une barre verticale :
   "hiit|amrap:12". Les valeurs existantes n'en contiennent pas, donc rien à migrer.
   • AMRAP    : le plus de tours possible dans le temps imparti (décompte)
   • EMOM     : un exercice au départ de chaque minute (décompte par minute)
   • FOR TIME : un nombre de tours à boucler le plus vite possible (chrono qui monte) */
const FORMATS=[
  ["","⏹","Classique (séries / repos)",""],
  ["amrap","♾️","AMRAP","Durée en minutes"],
  ["emom","⏱","EMOM","Durée en minutes"],
  ["fortime","🏁","For Time","Nombre de tours"]
];
function seanceFormat(c,bloc){
  const brut=(c.seanceTypes&&c.seanceTypes[bloc])||"";
  const part=String(brut).split("|")[1]||"";
  const [mode,val]=part.split(":");
  if(!mode) return {mode:"",val:0};
  return {mode,val:parseInt(val)||0};
}
function setSeanceFormat(c,bloc,mode,val){
  c.seanceTypes=c.seanceTypes||{};
  const disc=String(c.seanceTypes[bloc]||"").split("|")[0];
  const suffixe=mode?("|"+mode+":"+(val||0)):"";
  if(disc||suffixe) c.seanceTypes[bloc]=disc+suffixe; else delete c.seanceTypes[bloc];
}
function formatBadge(c,bloc){
  const f=seanceFormat(c,bloc);
  if(!f.mode) return "";
  const d=FORMATS.find(x=>x[0]===f.mode); if(!d) return "";
  const suff=f.mode==="fortime"?`${f.val} tours`:`${f.val} min`;
  return `<span class="tag" style="background:rgba(76,139,245,.18);color:#7FB0FF;border:1px solid rgba(76,139,245,.4);font-size:11px;white-space:nowrap">${d[1]} ${d[2]} · ${suff}</span>`;
}
function seanceType(c,bloc){ return String((c.seanceTypes&&c.seanceTypes[bloc])||"").split("|")[0]; }
function seanceTypeBadge(c,bloc){
  const t=SEANCE_TYPES.find(x=>x[0]===seanceType(c,bloc));
  return t?`<span class="tag" style="background:rgba(184,134,47,.18);color:var(--amber);border:1px solid rgba(184,134,47,.4);font-size:11px;white-space:nowrap">${t[1]} ${t[2]}</span>`:"";
}
function seanceRounds(c,bloc){ return (c.seanceRounds&&+c.seanceRounds[bloc])||0; }
function tourRepos(c,bloc){ return (c.seanceTourRepos&&c.seanceTourRepos[bloc])||""; }
function seanceRoundsBadge(c,bloc){
  const n=seanceRounds(c,bloc);
  return n>1?`<span class="tag" style="background:rgba(176,31,31,.18);color:#FF6B6B;border:1px solid rgba(176,31,31,.4);font-size:11px;white-space:nowrap">🔁 ${n} tours</span>`:"";
}

const BK_KEY="sauvegarde_auto", BK_DATE="sauvegarde_date", BK_EXPORT="dernier_export";
function sauvegardeAuto(){
  try{
    if(S.isClient||!(S.clients||[]).length) return;
    const payload={app:"Alex Coaching",version:1,exportedAt:new Date().toISOString(),clients:S.clients};
    localStorage.setItem(BK_KEY,JSON.stringify(payload));
    localStorage.setItem(BK_DATE,new Date().toISOString());
  }catch(e){ /* espace saturé : sans gravité, la base reste la référence */ }
}
function infoSauvegarde(){
  try{
    const d=localStorage.getItem(BK_DATE), ex=localStorage.getItem(BK_EXPORT);
    const jours=x=>x?Math.floor((Date.now()-new Date(x).getTime())/864e5):null;
    return {auto:d,autoJours:jours(d),export:ex,exportJours:jours(ex)};
  }catch(e){ return {auto:null,autoJours:null,export:null,exportJours:null}; }
}
function exportDue(){ const i=infoSauvegarde(); return i.exportJours===null||i.exportJours>=7; }
function restaurerAuto(){
  try{
    const raw=localStorage.getItem(BK_KEY); if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

function lundiDe(d){ const x=new Date(d); const j=(x.getDay()+6)%7; x.setDate(x.getDate()-j); x.setHours(0,0,0,0); return x; }
function planningTab(){
  const base=lundiDe(new Date(Date.now()+(S.semDecal||0)*7*864e5));
  const jours=Array.from({length:7},(_,i)=>{ const d=new Date(base); d.setDate(d.getDate()+i); return d; });
  const memeJour=(a,b2)=>a.toDateString()===b2.toDateString();

  const parJour=jours.map(d=>{
    const rdv=(S.clients||[]).filter(c=>c.prochainRdv&&memeJour(new Date(c.prochainRdv),d))

    const iso=d.toISOString().slice(0,10);
    const faites=(S.clients||[]).filter(c=>(c.seances||[]).some(s2=>s2.fait&&s2.date===iso));

            const fait=(c.seances||[]).some(s2=>s2.fait&&s2.date===d.toISOString().slice(0,10));
            return `<button class="pl-rdv${fait?" ok":""}" data-act="open" data-id="${c.id}">

/* ===== RÉCAP MENSUEL : synthèse prête à envoyer au client ===== */
function monthRecap(c){
  const now=new Date(), m=now.getMonth(), y=now.getFullYear();
  const inMonth=d=>{ const x=new Date(d+"T12:00:00"); return !isNaN(x)&&x.getMonth()===m&&x.getFullYear()===y; };
  const seances=(c.seances||[]).filter(s2=>s2.fait&&s2.date&&inMonth(s2.date)).length;
  const ms=(c.mesures||[]).filter(x=>typeof x.poids==="number");
  const first=ms.length?ms[0]:null, last=ms.length?ms[ms.length-1]:null;
  const dPoids=(first&&last&&first!==last)?+(last.poids-first.poids).toFixed(1):null;
  const deltaMens={};
  [["taille","Tour de taille"],["hanches","Tour de hanches"],["poitrine","Tour de poitrine"],["bras","Tour de bras"],["cuisse","Tour de cuisse"],["mollet","Tour de mollet"]].forEach(([k,label])=>{
    const pts=(c.mesures||[]).filter(x=>typeof x[k]==="number");
    if(pts.length>=2) deltaMens[label]=+(pts[pts.length-1][k]-pts[0][k]).toFixed(1);
  });
  const prs=(c.program||[]).map(e=>({nom:e.nom,pr:exoPR(e)})).filter(x=>x.pr&&inMonth(x.pr.date));
  const stk=streakWeeks(c);
  return {seances,dPoids,deltaMens,prs,stk,mois:now.toLocaleDateString("fr-FR",{month:"long",year:"numeric"})};
}
function monthRecapText(c){
  const r=monthRecap(c), p=(c.nom||"").split(" ")[0];
  let t=`Bilan du mois — ${r.mois} 💪\n\nSalut ${p} !\n\n`;
  t+=`✅ ${r.seances} séance${r.seances>1?"s":""} ce mois-ci\n`;
  if(r.stk>=2) t+=`🔥 ${r.stk} semaines d'affilée sans lâcher\n`;
  if(r.dPoids!==null) t+=`⚖️ Poids : ${r.dPoids>0?"+":""}${String(r.dPoids).replace(".",",")} kg depuis le début\n`;
  Object.entries(r.deltaMens).forEach(([label,d])=>{
    t+=`📏 ${label} : ${d>0?"+":""}${String(d).replace(".",",")} cm\n`;
  });
  if(r.prs.length){ t+=`\n🏆 Nouveaux records :\n`; r.prs.forEach(x=>{ t+=`   • ${x.nom} : ${x.pr.charge}\n`; }); }
  t+=`\nContinue comme ça, on avance !`;
  return t;
}

/* ===== RECORDS PERSONNELS (calculés depuis l'historique de charges déjà saisi) ===== */
function chargeNum(str){
  const t2=String(str||"").replace(",",".");
  const kg=t2.match(/(\d+(?:\.\d+)?)\s*(?:kg|kilo)/i);   // "12 reps à 40 kg" -> 40
  if(kg) return parseFloat(kg[1]);
  const m=t2.match(/(\d+(?:\.\d+)?)/);
  return m?parseFloat(m[1]):null;
}
function exoPR(e){
  const h=(e.historique||[]).map(x=>({...x,n:chargeNum(x.charge)})).filter(x=>x.n!==null);
  if(!h.length) return null;
  let best=h[0]; h.forEach(x=>{ if(x.n>=best.n) best=x; });
  return best;
}
function isNewPR(e){
  const h=(e.historique||[]).map(x=>chargeNum(x.charge)).filter(v=>v!==null);
  if(h.length<2) return false;
  return h[h.length-1]>Math.max(...h.slice(0,-1));
}
function prBadge(e){
  const pr=exoPR(e); if(!pr) return "";
  const isLast=(e.historique||[]).length && (e.historique[e.historique.length-1].charge===pr.charge);
  return `<div class="exd" style="color:#F0B429;font-size:12px;font-weight:700">🏆 Record : ${esc(pr.charge)} <span style="color:var(--grey2);font-weight:400">(${frDate(pr.date)})</span>${isLast?' <span style="color:#4CAF50">· actuel</span>':""}</div>`;
}

  const dEx=S.exDraft||{};
  // Est-on en train d'éditer un exercice existant ? (S.exDraft.id correspond à un exo du programme)
  const editingId=(dEx&&dEx.id&&prog.some(x=>x.id===dEx.id))?dEx.id:null;
  // Formulaire d'exercice : défini AVANT renderCard qui le référence en cas d'édition inline
  const exForm=editable?`
    <div class="panel" ${dEx.nom?'style="border-color:rgba(184,134,47,.5)"':''}><div class="ph">${dEx.nom?"✏️ Modifier l'exercice":"Nouvel exercice"}</div>

      <label class="fld"><span>Exercice (ou saisie libre)</span><input id="ex-nom" list="exos-fr" placeholder="Ex. Presse à cuisses" value="${esc(dEx.nom||"")}"></label>

      ${(()=>{
        const varOn=hasVarReps(dEx)||hasVarCharge(dEx)||dEx._varMode;

        return `

  const tplBox=editable?`

  const renderCard=(e,i)=>{

  let list;

    list=`<p class="muted" style="margin-bottom:14px">Aucun exercice.${editable?" Ajoutez-en ci-dessous.":""}</p>`;

            ${f.mode==="fortime"?`<p class="muted" style="font-size:11.5px;margin:-6px 0 10px">🏁 ${f.val} tours de tous les exercices, le plus vite possible. Le chrono monte et s'arrête au dernier tour.</p>`:""}`;

        :(seanceType(c,b)||seanceRounds(c,b)>1||seanceFormat(c,b).mode?`<div style="margin:-6px 0 10px;display:flex;gap:6px;flex-wrap:wrap">${seanceTypeBadge(c,b)}${formatBadge(c,b)}${seanceRoundsBadge(c,b)}</div>`:"")}`:`<div class="sec-head" style="margin-top:8px"><h2 style="font-size:16px;color:var(--grey)">Autres exercices</h2></div>`}

  const form=editingId?"":exForm;
  const endedWarn=(editable&&programEnded(c))?`<div class="panel" style="margin-bottom:12px;border-color:rgba(176,31,31,.45);background:linear-gradient(180deg,rgba(176,31,31,.08),transparent)">

  const pdfBtn=prog.length?`<div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn g full" data-act="print-prog">🖨 PDF</button>

}
function progres(c,editable){

      <label class="fld" style="margin-bottom:0"><span>Tour de taille (cm)</span><input id="me-taille" type="number" step="0.5" inputmode="decimal" placeholder="${derniereTaille||"—"}"></label>

          <label class="fld" style="margin-bottom:0"><span>Tour de poitrine (cm)</span><input id="me-poitrine" type="number" step="0.5" inputmode="decimal" placeholder="${dernierePoitrine||"—"}"></label>
        </div>
        <div class="r2" style="margin-top:10px">
          <label class="fld" style="margin-bottom:0"><span>Tour de bras (cm)</span><input id="me-bras" type="number" step="0.5" inputmode="decimal" placeholder="${dernierBras||"—"}"></label>
          <label class="fld" style="margin-bottom:0"><span>Tour de cuisse (cm)</span><input id="me-cuisse" type="number" step="0.5" inputmode="decimal" placeholder="${derniereCuisse||"—"}"></label>
        </div>
        <label class="fld" style="margin-top:10px"><span>Tour de mollet (cm)</span><input id="me-mollet" type="number" step="0.5" inputmode="decimal" placeholder="${dernierMollet||"—"}"></label>

      </div>

    <button class="btn p full" data-act="add-me">💾 Enregistrer la mesure</button>
  </div>`;
  const rows=ms.map((m,i)=>({m,i})).reverse().map(({m,i})=>{
    const parts=[];
    if(m.taille) parts.push(`Taille ${m.taille} cm`);
    if(m.hanches) parts.push(`Hanches ${m.hanches} cm`);
    if(m.poitrine) parts.push(`Poitrine ${m.poitrine} cm`);
    if(m.bras) parts.push(`Bras ${m.bras} cm`);
    if(m.cuisse) parts.push(`Cuisse ${m.cuisse} cm`);

    return `<div class="mrow"><div><span class="mv">${m.poids} kg</span><span class="md">${frDate(m.date)}</span>${parts.length?`<div class="md" style="margin-left:0">${parts.join(" · ")}</div>`:""}${m.note?`<div class="md" style="margin-left:0">${esc(m.note)}</div>`:""}</div>

    if(!ms.length) return '';

    return `<div class="pstats">
      <div class="pstat"><div class="pv">${start} kg</div><div class="pl">Départ</div></div>
      <div class="pstat delta ${delta>0?'up':''}"><div class="pv">${delta>0?'+':''}${delta} kg</div><div class="pl">Évolution</div></div>
      <div class="pstat"><div class="pv">${cur} kg</div><div class="pl">Actuel</div></div>
      ${target?`<div class="pstat target"><div class="pv">${target} kg</div><div class="pl">Objectif</div></div>`:''}
    </div>`;})();
  // Graphiques et résumés pour toutes les mensurations
  const MENS_KEYS=[["taille","Tour de taille"],["hanches","Tour de hanches"],["poitrine","Tour de poitrine"],["bras","Tour de bras"],["cuisse","Tour de cuisse"],["mollet","Tour de mollet"]];
  const mensSummary=(()=>{
    const chunks=MENS_KEYS.map(([k,label])=>{
      const pts=ms.filter(m=>typeof m[k]==="number");
      if(pts.length<1) return "";
      const start=pts[0][k], cur=pts[pts.length-1][k];
      const delta=+(cur-start).toFixed(1);
      const color=delta===0?"var(--grey)":(delta<0?"#4CAF50":"var(--amber2)");
      return `<div class="pstat"><div class="pv" style="font-size:16px">${cur}<span style="font-size:11px;color:var(--grey2)"> cm</span></div><div class="pl">${label.replace("Tour de ","")}${pts.length>=2?` <span style="color:${color};font-weight:700">${delta>0?"+":""}${delta}</span>`:""}</div></div>`;
    }).filter(Boolean);
    if(!chunks.length) return "";
    return `<div class="pstats" style="margin-top:10px">${chunks.join("")}</div>`;
  })();
  const mensCharts=MENS_KEYS.map(([k,label])=>{
    const pts=ms.filter(m=>typeof m[k]==="number").map(m=>({date:m.date,poids:m[k]}));
    if(pts.length<2) return "";
    return `<div class="sec-head" style="margin-top:4px"><h2 style="font-size:15px;color:var(--amber)">${label}</h2></div><div class="chartbox">${chart(pts,undefined,"cm")}</div>`;
  }).join("");
  const emptyHint=!ms.length?`<p class="muted" style="text-align:center;padding:10px 0;font-size:13px">Aucune mesure encore — ajoute-en une ci-dessus pour lancer le suivi.</p>`:"";
  const chartBox=ms.length?`<div class="chartbox">${chart(ms,c.objectifPoids||undefined)}</div>`:"";
  return form+chips+chartBox+mensSummary+mensCharts+emptyHint+rows;
}

function quoteOfDay(){const d=new Date();const doy=Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);return QUOTES[doy%QUOTES.length];}
function streakWeeks(c){
  const done=(c.seances||[]).filter(x=>x.fait&&x.date);
  if(!done.length) return 0;
  const monday=d=>{const m=new Date(d);const day=(m.getDay()+6)%7;m.setDate(m.getDate()-day);m.setHours(0,0,0,0);return m;};
  const w0=monday(new Date());
  const count=i=>{const st=new Date(w0);st.setDate(st.getDate()-7*i);const en=new Date(st);en.setDate(en.getDate()+7);
    return done.filter(x=>{const d=new Date(x.date+"T12:00:00");return d>=st&&d<en;}).length;};
  let i=count(0)>0?0:1, k=0;
  while(k<52 && count(i+k)>0) k++;
  return k;
}

/* barres d'assiduité : séances validées par semaine (8 dernières) */
function adherenceChart(c){
  const done=(c.seances||[]).filter(x=>x.fait&&x.date);
  if(!done.length) return "";
  const now=new Date(); now.setHours(12,0,0,0);
  const monday=d=>{const m=new Date(d);const day=(m.getDay()+6)%7;m.setDate(m.getDate()-day);m.setHours(0,0,0,0);return m;};
  const w0=monday(now);
  const weeks=Array.from({length:8},(_,i)=>{const st=new Date(w0);st.setDate(st.getDate()-7*(7-i));return st;});
  const counts=weeks.map(st=>{const en=new Date(st);en.setDate(en.getDate()+7);
    return done.filter(x=>{const d=new Date(x.date+"T12:00:00");return d>=st&&d<en;}).length;});
  const max=Math.max(3,...counts);
  const W=300,H=64,bw=26;
  const gid="ad"+Math.random().toString(36).slice(2,7);
  const bars=counts.map((n2,i)=>{
    const h2=n2?Math.max(6,Math.round(n2/max*44)):3;
    const x=10+i*36, y=50-h2;
    const cur=i===7;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h2}" rx="5" fill="${n2?(cur?`url(#barCur-${gid})`:`url(#bar-${gid})`):'#241D18'}" ${n2?`class="bar-grow" style="transform-origin:${x+bw/2}px 50px;animation-delay:${i*45}ms"`:""}/>
      ${n2?`<text x="${x+bw/2}" y="${y-5}" font-size="11.5" font-weight="800" fill="${cur?'#E0A94A':'#F2EDE7'}" text-anchor="middle">${n2}</text>`:""}
      ${cur?`<text x="${x+bw/2}" y="${H-2}" font-size="9" fill="#E0A94A" font-weight="700" text-anchor="middle">cette sem.</text>`:""}`;
  }).join("");
  return `<div class="panel" style="margin-bottom:14px"><div class="ph" style="font-size:13px">Assiduité — 8 dernières semaines</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%">
      <defs>
        <linearGradient id="bar-${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#CE2A2A"/><stop offset="100%" stop-color="#7E1712"/></linearGradient>
        <linearGradient id="barCur-${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E0A94A"/><stop offset="100%" stop-color="#B8862F"/></linearGradient>
      </defs>
      <line x1="6" y1="50.5" x2="294" y2="50.5" stroke="#2E2620"/>
      ${bars}</svg></div>`;
}

const WK={on:false,c:null,jour:"",exos:[],idx:0,serie:1,rest:0,restInt:null};

/* écran maintenu allumé pendant la séance */
let WAKE=null;
async function wakeOn(){ try{ if("wakeLock" in navigator){ WAKE=await navigator.wakeLock.request("screen"); } }catch(e){} }
function wakeOff(){ try{ if(WAKE){ WAKE.release(); WAKE=null; } }catch(e){} }
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){
    // Retour du sélecteur de photo : si aucun fichier n'a été choisi (annulation),
    // l'événement "change" n'arrivera jamais. On libère le drapeau après un court
    // délai, en laissant à un éventuel "change" le temps de se déclencher d'abord.
    if(S.pickerOuvert){
      setTimeout(()=>{
        const f=document.getElementById("msg-photo");
        if(!f || !f.files || !f.files.length) S.pickerOuvert=false;
      },1200);
    }
    if(WK.on) wakeOn();
    if(TIMER.exId) wakeOn();
    // Au retour au premier plan : on force l'envoi des push en attente au cas où
    // une notification de fin de repos n'a pas encore été traitée par le serveur.
    try{ flushPushes(); }catch(_){}
    // On recharge les données pour récupérer les nouveaux messages (retour depuis une
    // notification par exemple). reloadKeepingView() est la version protégée : elle
    // s'abstient si une séance tourne, si un champ est en cours de saisie ou si un
    // vocal joue — un render() brut écraserait l'écran de séance ou le formulaire.
    try{ if(sb && S.session) reloadKeepingView(); }catch(_){}
    // Rattrapage : si l'écran s'est quand même éteint/verrouillé pendant le repos,
    // l'horloge réelle nous dit où on en est → on rejoue l'alarme si le temps est écoulé
    if(TIMER.exId && TIMER.end && Date.now()>=TIMER.end){
      const exId=TIMER.exId, label=TIMER.label;
      const retard=(Date.now()-TIMER.end)/1000;
      clearInterval(TIMER.int); TIMER.int=null;
      const bb=document.getElementById("tmr-"+exId); if(bb){ bb.textContent=bb.dataset.label; bb.classList.remove("run"); }
      TIMER.exId=null;
      // On ne sonne que si le repos vient tout juste de se terminer (moins de 20 s).
      // Au-delà, l'info est périmée : faire retentir l'alarme pour un repos fini
      // depuis plusieurs minutes n'apporte rien et fait sursauter pour rien.
      if(retard<=20) alarm(1,"⏱ Repos terminé",label||"C'est reparti !");
      if(retard<=20) voixGo("C'est parti !");
      else toast("⏱ Ton repos est terminé depuis "+(retard<60?Math.round(retard)+" s":Math.round(retard/60)+" min"));
      paintBigTimerDone(label);
    }
  }
});

function openWorkout(jour){
  const c=sel(); if(!c) return;
  const exos=(c.program||[]).filter(e=>(e.bloc||"")===jour);
  if(!exos.length) return;
  stopTimer();
  // Format AMRAP / EMOM / For Time : moteur dédié, la logique séries/repos ne s'applique pas
  const f=seanceFormat(c,jour);
  if(f.mode && f.val>0){ wodStart(c,jour,exos,f); return; }
  const rounds=seanceRounds(c,jour);
  WK.on=true; WK.c=c; WK.jour=jour; WK.exos=exos; WK.idx=0; WK.serie=1; WK.rest=0;
  WK.rounds=rounds>1?rounds:0; WK.round=1; WK.start=Date.now();
  unlockAudio();     // le clic sur « Lancer la séance » autorise le son : on en profite
  garderActif();     // et on maintient l'appli active dès le départ
  wakeOn();
  let ov=document.getElementById("wk");
  if(!ov){ ov=document.createElement("div"); ov.id="wk"; document.body.appendChild(ov); }
  wkRender();
}
function closeWorkout(force){
  // La confirmation vient AVANT toute libération : si l'user annule, la séance
  // doit continuer intacte (sinon le son de maintien était coupé pour de bon
  // et l'alarme ne sonnait plus écran verrouillé).
  if(!force && !confirm("Quitter la séance en cours ?")) return;
  libererActif();
  cancelScheduledPush();   // pas de notif "Repos terminé" après avoir quitté
  if(WK.restInt){ clearInterval(WK.restInt); WK.restInt=null; }
  if(WK.restTO){ clearTimeout(WK.restTO); WK.restTO=null; }
  WK.on=false;
  wakeOff();
  const ov=document.getElementById("wk"); if(ov) ov.remove();
}
/* Superset : liste des exercices du même groupe, dans l'ordre */
function ssPartners(ex){
  if(!ex||!ex.ss) return [];
  return WK.exos.filter(x=>x.ss===ex.ss);
}
function wkSerieDone(){
  const ex=WK.exos[WK.idx];
  const lastSerie=WK.serie>=(ex.series||1);
  const lastExo=WK.idx>=WK.exos.length-1;

  // Mode circuit (nombre de tours défini) : chaque exercice se fait UNE fois, puis on tourne
  if(WK.rounds>1){
    if(!lastExo){
      // Transition entre deux exercices du MÊME tour : repos propre à l'exercice qui vient d'être fait
      WK.idx++;
      WK.roundTransition=false;
      wkStartRest(parseRepos(ex.repos)||20);
      return;
    }
    // Dernier exercice du tour : passage au tour suivant, avec son propre repos (souvent plus long)
    if(WK.round>=WK.rounds){ wkFinish(); return; }
    WK.round++; WK.idx=0;
    WK.roundTransition=true;
    wkStartRest(parseRepos(tourRepos(WK.c,WK.jour))||60);
    return;
  }

  // Superset : enchaîner l'exercice suivant du groupe SANS repos
  if(ex.ss){
    const grp=ssPartners(ex);
    const posInGrp=grp.findIndex(x=>x.id===ex.id);
    if(posInGrp>=0&&posInGrp<grp.length-1){
      const nextEx=grp[posInGrp+1];
      const ni=WK.exos.findIndex(x=>x.id===nextEx.id);
      if(ni>=0){ WK.idx=ni; wkRender(); return; }   // même série, pas de repos
    }
    // Dernier du superset : on revient au 1er du groupe pour la série suivante
    if(posInGrp===grp.length-1){
      const first=grp[0];
      const fi=WK.exos.findIndex(x=>x.id===first.id);
      const serieCourante=WK.serie;
      const maxSeries=Math.max(...grp.map(x=>x.series||1));
      if(serieCourante<maxSeries){
        WK.idx=fi>=0?fi:WK.idx; WK.serie=serieCourante+1;
        wkStartRest(parseRepos(ex.repos)||60);
        return;
      }
      // superset terminé : passer à l'exercice suivant hors du groupe
      const after=WK.exos.findIndex((x,i)=>i>WK.idx&&x.ss!==ex.ss);
      if(after<0){ wkFinish(); return; }
      WK.idx=after; WK.serie=1;
      wkStartRest(parseRepos(ex.repos)||60);
      return;
    }
  }

  if(lastSerie&&lastExo){ wkFinish(); return; }
  if(lastSerie){ WK.idx++; WK.serie=1; } else { WK.serie++; }
  const secs=parseRepos(ex.repos)||60;
  wkStartRest(secs);
}
function wkStartRest(secs){
  if(WK.restInt) clearInterval(WK.restInt);
  WK.rest=secs; WK.restTotal=secs; WK.restEnd=Date.now()+secs*1000; // horloge réelle
  garderActif();   // maintient l'appli active pour que l'alarme sonne écran verrouillé
  wkRender();
  const exNext=WK.exos[WK.idx];
  schedulePush("⏱ Repos terminé",exNext?("Série suivante : "+exNext.nom):"C'est reparti !",secs);
  // Fin de repos : déclenchement à l'instant exact. L'intervalle d'affichage tourne
  // toutes les 500 ms, donc s'en servir pour sonner décalait le bip d'un demi-temps
  // par rapport au 0:00 affiché.
  if(WK.restTO) clearTimeout(WK.restTO);
  WK.restTO=setTimeout(()=>{
    WK.restTO=null;
    if(WK.restInt){ clearInterval(WK.restInt); WK.restInt=null; }
    WK.rest=0;
    const exNow=WK.exos[WK.idx];
    alarm(1,"⏱ Repos terminé",exNow?("Série suivante : "+exNow.nom):"C'est reparti !");
    voixGo("C'est parti !");
    if(!WK.on) libererActif();
    wkRender();
  }, Math.max(0,WK.restEnd-Date.now()));
  WK.restInt=setInterval(()=>{
    const prev=WK.rest;
    WK.rest=Math.max(0,Math.round((WK.restEnd-Date.now())/1000));
    const el=document.getElementById("wk-rest-n");
    if(el){
      el.textContent=Math.floor(WK.rest/60)+":"+String(WK.rest%60).padStart(2,"0");
      el.classList.toggle("urgent",WK.rest<=10&&WK.rest>0);
    }
    const ring=document.getElementById("wk-ring");
    if(ring){
      const tot=WK.restTotal||1;
      ring.setAttribute("stroke-dashoffset",(326.7*(1-WK.rest/tot)).toFixed(1));
      ring.setAttribute("stroke",WK.rest<=10?"#E0A94A":"#CE2A2A");
    }
    // Décompte vocal : 5, 4, 3, 2, 1 pendant les 5 dernières secondes (sur le passage d'une seconde)
    if(WK.rest!==prev && WK.rest>=1 && WK.rest<=5){
      countdownVoice(WK.rest);
    }
    if(WK.rest<=0){ clearInterval(WK.restInt); WK.restInt=null; }
  },200);
}
/* Annonce vocale de reprise, juste après la fanfare de fin de repos. */
function voixGo(phrase){
  try{
    if(!("speechSynthesis" in window)) return;
    if(audioMode()==="silence") return;   // mode notifications seules : aucun son local
    // La fanfare occupe 0 à ~0,90 s. On laisse une respiration : à 950 ms la voix
    // tombait encore dans sa résonance et se faisait couvrir.
    setTimeout(()=>{
      try{
        const u=new SpeechSynthesisUtterance(phrase||"C'est parti !");
        u.lang="fr-FR"; u.rate=1.05; u.pitch=1.1;
        u.volume=Math.min(1,(typeof volAlarme==="function"?volAlarme():0.7)+0.15);
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      }catch(_){}
    },1100);
  }catch(_){}
}
/* Prononce un chiffre à voix haute (compte à rebours des 5 dernières secondes du repos). */
function countdownVoice(n){
  try{
    if(!("speechSynthesis" in window)) return;
    // En mode silence on ne parle pas ; en mode musique le décompte est court
    // et la musique reprend juste après.
    if(audioMode()==="silence") return;
    const u=new SpeechSynthesisUtterance(String(n));
    u.lang="fr-FR"; u.rate=1.1; u.volume=Math.min(1, (typeof volAlarme==="function"?volAlarme():1));
    speechSynthesis.cancel(); // évite l'empilage
    speechSynthesis.speak(u);
  }catch(_){}
}
function wkSkipRest(){
  if(WK.restInt){ clearInterval(WK.restInt); WK.restInt=null; }
  if(WK.restTO){ clearTimeout(WK.restTO); WK.restTO=null; }
  cancelScheduledPush();   // sinon la notif "Repos terminé" arriverait pour un repos sauté
  WK.rest=0; wkRender();
}
/* Annule la notification programmée du repos en cours (repos sauté / séance quittée).
   Supprime la ligne dans scheduled_pushes ET arrête les tentatives de flush. */
function cancelScheduledPush(){
  try{
    if(PUSH_SCHED.interval){ clearInterval(PUSH_SCHED.interval); PUSH_SCHED.interval=null; }
    if(PUSH_SCHED.timeout){ clearTimeout(PUSH_SCHED.timeout); PUSH_SCHED.timeout=null; }
    if(PUSH_SCHED.id && sb){
      sb.from("scheduled_pushes").delete().eq("id",PUSH_SCHED.id).then(()=>{});
    }
    PUSH_SCHED.id=null;
  }catch(e){}
}
/* ===== MOTEUR WOD : AMRAP / EMOM / FOR TIME =====
   Volontairement séparé du mode guidé classique (WK) : la logique séries/repos
   ne s'applique pas ici, et les mélanger fragiliserait les deux. */
const WOD={on:false,c:null,jour:"",mode:"",val:0,exos:[],tours:0,idx:0,minute:0,
           debut:0,finAt:0,int:null,dernierBip:-1};
function wodStart(c,jour,exos,f){
  WOD.on=true; WOD.c=c; WOD.jour=jour; WOD.mode=f.mode; WOD.val=f.val;
  WOD.exos=exos; WOD.tours=0; WOD.idx=0; WOD.minute=0; WOD.dernierBip=-1;
  WOD.debut=Date.now();
  WOD.finAt=(f.mode==="fortime")?0:(Date.now()+f.val*60000);
  unlockAudio(); garderActif(); wakeOn();
  let ov=document.getElementById("wod");
  if(!ov){ ov=document.createElement("div"); ov.id="wod"; document.body.appendChild(ov); }
  wodRender();
  if(WOD.int) clearInterval(WOD.int);
  WOD.int=setInterval(wodTick,200);
}
function wodSecondes(){
  return WOD.mode==="fortime"
    ? Math.floor((Date.now()-WOD.debut)/1000)              // chrono qui monte
    : Math.max(0,Math.ceil((WOD.finAt-Date.now())/1000));  // décompte
}
function fmtChrono(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function wodTick(){
  if(!WOD.on) return;
  const s=wodSecondes();
  const el=document.getElementById("wod-time");
  if(el){
    el.textContent=fmtChrono(s);
    el.style.color=(WOD.mode!=="fortime"&&s<=10)?"#E0A94A":"var(--white)";
  }
  // EMOM : à chaque nouvelle minute, on passe à l'exercice suivant
  if(WOD.mode==="emom"){
    const ecoule=Math.floor((Date.now()-WOD.debut)/1000);
    const min=Math.floor(ecoule/60);
    if(min!==WOD.minute && min<WOD.val){
      WOD.minute=min;
      WOD.idx=min%WOD.exos.length;
      if(min%WOD.exos.length===0) WOD.tours++;
      alarm(1); voixGo("Go !");
      wodRender(); return;
    }
    const resteMin=59-(ecoule%60);
    const rm=document.getElementById("wod-minrest");
    if(rm) rm.textContent=resteMin+" s";
  }
  // Décompte vocal des 3 dernières secondes (une seule fois par seconde)
  if(WOD.mode!=="fortime" && s<=3 && s>0 && WOD.dernierBip!==s){
    WOD.dernierBip=s; countdownVoice(s);
  }
  if(WOD.mode!=="fortime" && s<=0) wodFinish();
}
function wodTourFait(){
  WOD.tours++;
  if(WOD.mode==="fortime" && WOD.tours>=WOD.val){ wodFinish(); return; }
  alarm(1);

}

function wodFinish(){

function wodClose(force){

function wkFinish(){

  let volume=0, series=0;
  (WK.exos||[]).forEach(e=>{

    <p style="color:var(--grey);margin-bottom:18px">${esc(WK.jour)}${seanceType(WK.c,WK.jour)?` · ${(SEANCE_TYPES.find(x=>x[0]===seanceType(WK.c,WK.jour))||["","",""])[2]}`:""}</p>
    <div class="fin-stats">
      ${stat(dureeMin+"′","durée")}

      ${stat(series,"séries")}
      ${volume?stat(volume.toLocaleString("fr-FR")+" kg","volume soulevé","#E0A94A"):""}
    </div>
    ${prs.length?`<div class="fin-pr">
      <div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#E0A94A;font-weight:800;margin-bottom:6px">🏆 ${prs.length>1?"Nouveaux records":"Nouveau record"}</div>
      ${prs.map(e=>`<div style="font-size:14px;color:var(--white)">${esc(e.nom)} — <b style="color:#E0A94A">${esc(e.charge)}</b></div>`).join("")}
    </div>`:""}
    <p style="color:var(--grey2);font-size:12.5px;margin:16px 0 8px">Enregistrée automatiquement dans ton suivi.</p>
    <p style="color:var(--amber);font-size:13px;font-style:italic;margin-bottom:22px;max-width:320px">« ${quoteOfDay()} »</p>

  alarm(3,"💪 Séance terminée",WK.jour+" — bravo !");

}
function wkRender(){

  const circuit=WK.rounds>1;

      <div class="rest-ring">

          <circle cx="60" cy="60" r="52" fill="none" stroke="#2E2620" stroke-width="7"/>

            transform="rotate(-90 60 60)" stroke-dasharray="326.7" stroke-dashoffset="${(326.7*(1-(WK.rest/(WK.restTotal||WK.rest||1)))).toFixed(1)}"/>
        </svg>
        <div id="wk-rest-n" class="rest-num">${Math.floor(WK.rest/60)}:${String(WK.rest%60).padStart(2,"0")}</div>
      </div>
      ${(()=>{
        // "Prochain exercice" ne s'affiche que quand on vient de finir la dernière série

        // À ce moment, wkSerieDone a déjà fait WK.idx++ et WK.serie=1.
        const isNewExercise=!circuit && WK.serie===1 && WK.idx>0;
        const nextEx=WK.exos[WK.idx]; // l'exercice qui suit ce repos = l'exercice courant
        if(WK.roundTransition){
          // Repos entre les tours : le prochain tour redémarre du premier exo
          const first=WK.exos[0];
          return `<p style="color:var(--grey);margin:14px 0 6px">Prochain tour</p>

/* ===== TIMER DE REPOS ===== */
const TIMER={int:null,exId:null};
function parseRepos(txt){
  if(!txt) return null;
  const t=String(txt).toLowerCase().trim();
  // "1:30" ou "1h30"
  const mm=t.match(/^(\d+)\s*[:h]\s*(\d{1,2})/);
  if(mm) return (+mm[1])*60+(+mm[2]);
  // "1 min 30", "1min30s", "2mn15" → minutes + secondes
  const ms=t.match(/(\d+)\s*(?:min|mn|')\s*(\d{1,2})\s*(?:s|sec)?/);
  if(ms) return (+ms[1])*60+(+ms[2]);
  const n=t.match(/(\d+([.,]\d+)?)/);
  if(!n) return null;
  const v=parseFloat(n[1].replace(",","."));
  if(t.includes("min")||t.includes("mn")||t.includes("'")) return Math.round(v*60);
  return Math.round(v); // secondes par défaut
}
/* Affiche une durée en secondes sous forme lisible : 45 s · 1 min 30 s · 2 min */
function fmtCourt(secs){
  const s2=Math.round(+secs||0);
  if(s2<=0) return "";
  if(s2<60) return s2+"s";
  const m=Math.floor(s2/60), r=s2%60;
  return r?`${m}min${r}`:`${m}min`;
}
function fmtDuree(secs){
  const s2=Math.round(+secs||0);
  if(s2<=0) return "";
  if(s2<60) return s2+" s";
  const m=Math.floor(s2/60), r=s2%60;
  return r?`${m} min ${r} s`:`${m} min`;
}
/* Normalise ce que le coach a tapé pour l'enregistrer proprement */
function normDuree(txt){
  const n=parseRepos(txt);
  return n?fmtDuree(n):(txt||"");
}
let AC=null;
let ALARM_EL=null, ALARM_PRIMED=false, SPEECH_PRIMED=false;
let ALARM_BUF=null; // buffer du carillon rendu une seule fois, rejoué ensuite (fiable même hors interaction directe)
function renderAlarmBuffer(){
  return new Promise(resolve=>{
    try{
      const Ctx=window.OfflineAudioContext||window.webkitOfflineAudioContext;
      const rate=44100, dur=1.4;
      const off=new Ctx(1,Math.ceil(rate*dur),rate);
      // Minuteur d'intervalles facon salle de sport / boxe :
      // trois bips courts et secs, puis un bip long plus aigu qui marque le depart.
      // Fanfare montante facon depart de round : deux notes breves qui lancent,
      // puis une note tenue plus haute qui claque. Sol - Do - Mi (392/523/659 Hz).
      // La 1re note tombe pile a 0:00 : c'est elle le repere, la montee suit.
      // Frequences gardees sous 700 Hz pour que les harmoniques evitent la bande
      // 2-4 kHz ou l'oreille sature vite.
      const bips=[[392.00,0.00,0.13],[523.25,0.15,0.13],[659.25,0.30,0.52]];
      bips.forEach(([freq,t0,len])=>{
        // Somme des gains sous 1.0 (0.30+0.08+0.03 = 0.41) : au-dela le signal
        // serait ecrete, et cet ecretage est ce qui rendait l'alarme douloureuse.
        [[freq,0.30],[freq*2,0.08],[freq*3,0.03]].forEach(([f,poids])=>{
          const o=off.createOscillator(), g=off.createGain();
          o.type="sine"; o.frequency.value=f;
          o.connect(g); g.connect(off.destination);
          g.gain.setValueAtTime(0.0001,t0);
          g.gain.exponentialRampToValueAtTime(poids,t0+0.02);
          g.gain.setValueAtTime(poids,t0+len*0.65);
          g.gain.exponentialRampToValueAtTime(0.0001,t0+len+0.05);
          o.start(t0); o.stop(t0+len+0.07);
        });
      });
      off.startRendering().then(buf=>resolve(buf)).catch(()=>resolve(null));
    }catch(e){ resolve(null); }
  });
}
function bufToWavBlob(buf){
  const len=buf.length*2+44, ab=new ArrayBuffer(len), v=new DataView(ab);
  const ws=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
  ws(0,"RIFF"); v.setUint32(4,len-8,true); ws(8,"WAVE"); ws(12,"fmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,buf.sampleRate,true); v.setUint32(28,buf.sampleRate*2,true);
  v.setUint16(32,2,true); v.setUint16(34,16,true); ws(36,"data"); v.setUint32(40,len-44,true);
  const d=buf.getChannelData(0); let o=44;
  for(let i=0;i<d.length;i++){ const s=Math.max(-1,Math.min(1,d[i])); v.setInt16(o,s<0?s*0x8000:s*0x7FFF,true); o+=2; }
  return new Blob([ab],{type:"audio/wav"});
}
async function primeAlarmEl(){
  if(ALARM_EL) return;
  try{
    const buf=await renderAlarmBuffer(); if(!buf) return;
    ALARM_BUF=buf;
    ALARM_EL=new Audio(URL.createObjectURL(bufToWavBlob(buf)));
    ALARM_EL.preload="auto";
  }catch(e){}
}
function unlockAudio(){
  // En mode "silence" on ne réveille jamais le canal audio local.
  // En mode "musique" on l'amorce UNE fois (bref blip au démarrage) : c'est
  // indispensable pour qu'iOS autorise l'alarme à sonner plus tard sans geste.
  const skipAudio=(audioMode()==="silence");
  if(!skipAudio){
    try{
      if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
      if(AC.state==="suspended") AC.resume();
    }catch(e){}
    if(!ALARM_PRIMED){
      ALARM_PRIMED=true;
      // Débloquage audio iOS : on joue un tout petit buffer SILENCIEUX (100ms de zéros).
      // Avantage : même si iPhone ignore muted au 1er play, il n'y a AUCUN son
      // (au lieu d'entendre 50ms du vrai carillon d'alarme, ce qui sonnait strident).
      try{
        const silentSrc="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
        const sil=new Audio(silentSrc);
        sil.volume=0; sil.preload="auto";
        sil.play().then(()=>{ sil.pause(); }).catch(()=>{});
      }catch(e){}
      // Amorçage de la synthèse vocale : sur iPhone, speechSynthesis reste muet
      // tant qu'il n'a pas été déclenché une première fois par un geste utilisateur.
      // Sans ça, le décompte "5, 4, 3, 2, 1" ne sortait jamais sur iOS.
      try{
        if("speechSynthesis" in window && !SPEECH_PRIMED){
          SPEECH_PRIMED=true;
          const u0=new SpeechSynthesisUtterance(" ");
          u0.volume=0; u0.lang="fr-FR";
          speechSynthesis.speak(u0);
        }
      }catch(e){}
      // On charge aussi le vrai buffer d'alarme en tâche de fond pour qu'il soit prêt à sonner
      primeAlarmEl().catch(()=>{});
    }
  }
  // La permission notif et la souscription push sont toujours demandées (elles ne coupent pas la musique)
  try{
    if(window.Notification && Notification.permission==="default"){
      Notification.requestPermission().then(p=>{ if(p==="granted") subscribeToPush(); });
    } else if(window.Notification && Notification.permission==="granted"){
      subscribeToPush();
    }
  }catch(e){}
}

/* ===== SONNERIE EN ARRIÈRE-PLAN =====
   iOS coupe le JavaScript dès que l'écran se verrouille. La seule méthode fiable
   consiste à faire jouer un son continu inaudible : le téléphone considère alors
   l'appli comme "en train de jouer de l'audio" et la laisse active jusqu'à l'alarme. */
let KEEP_EL=null, KEEP_ON=false;
function creerSilence(secs){
  try{
    const Ctx=window.OfflineAudioContext||window.webkitOfflineAudioContext;
    const rate=22050, dur=secs||8;
    const off=new Ctx(1,Math.ceil(rate*dur),rate);
    // Ton très grave à volume infime : inaudible mais reconnu comme lecture audio
    const o=off.createOscillator(), g=off.createGain();
    o.type="sine"; o.frequency.value=30;
    o.connect(g); g.connect(off.destination);
    // Fondu d'entrée et de sortie : démarrer et couper net faisait claquer le
    // haut-parleur au moment où iOS engage la sortie audio.
    g.gain.setValueAtTime(0.0001,0);
    g.gain.linearRampToValueAtTime(0.0016,0.35);
    g.gain.setValueAtTime(0.0016,Math.max(0.4,dur-0.35));
    g.gain.linearRampToValueAtTime(0.0001,dur);
    o.start(0); o.stop(dur);
    return off.startRendering();
  }catch(e){ return Promise.resolve(null); }
}
async function garderActif(){
  if(KEEP_ON) return;
  // Le son de maintien n'existe qu'en mode "alarme" : c'est lui qui coupe la musique
  // pendant toute la séance, en échange d'une alarme fiable écran verrouillé.
  if(audioMode()!=="alarme") return;
  try{
    if(!KEEP_EL){
      const buf=await creerSilence(8); if(!buf) return;
      KEEP_EL=new Audio(URL.createObjectURL(bufToWavBlob(buf)));
      KEEP_EL.loop=true; KEEP_EL.volume=0.02; KEEP_EL.preload="auto";
      KEEP_EL.setAttribute("playsinline","");
    }
    await KEEP_EL.play();
    KEEP_ON=true;
    if(navigator.mediaSession){
      navigator.mediaSession.metadata=new MediaMetadata({title:"Minuteur en cours",artist:"Alex Coaching"});
      navigator.mediaSession.playbackState="playing";
    }
  }catch(e){ /* refusé sans geste : l'alarme reste fonctionnelle appli ouverte */ }
}
function libererActif(){
  try{
    if(KEEP_EL&&KEEP_ON){ KEEP_EL.pause(); KEEP_ON=false;
      if(navigator.mediaSession) navigator.mediaSession.playbackState="none"; }
  }catch(e){}
}

function notifyRing(title,body){
  try{
    if(window.Notification && Notification.permission==="granted"){
      const n=new Notification(title,{body:body||"",tag:"alex-coaching-timer",renotify:true,silent:false});
      setTimeout(()=>{ try{n.close();}catch(e){} },8000);
    }
  }catch(e){}
}
function volAlarme(){
  const v=parseFloat(localStorage.getItem("vol_alarme"));
  // Par défaut 70 % : à 100 % la sonnerie est inutilement agressive en intérieur.
  // Le curseur reste disponible pour monter en salle bruyante.
  return isNaN(v)?0.7:Math.max(0.2,Math.min(1,v));
}
function alarm(reps,notifTitle,notifBody){
  reps=reps||4;
  const VOL=volAlarme();
  // Mode "silence" uniquement : aucun son local, on passe par une push serveur
  // (qui déclenche le son système iOS, contrairement à new Notification()).
  const skipAudio=(audioMode()==="silence");
  if(skipAudio){
    try{ if(navigator.vibrate) navigator.vibrate([300,150,300,150,400]); }catch(e){}
    // Push serveur immédiate à soi-même => son iOS système garanti
    try{
      const me=((S.session&&S.session.user&&S.session.user.email)||"").toLowerCase();
      if(me) pushTo(me, notifTitle||"⏱ Repos terminé", notifBody||"");
    }catch(_){}
    return;
  }
  unlockAudio();
  // Canal 1 : élément <audio> pré-amorcé — le plus fiable pour sonner à CHAQUE répétition, même sans geste juste avant
  try{
    if(ALARM_EL){
      for(let i=0;i<reps;i++){
        // Réutilise le MÊME élément (déjà déverrouillé par un vrai geste) plutôt qu'un clone,
        // qui pourrait redemander une interaction sur iPhone
        setTimeout(()=>{ try{ ALARM_EL.currentTime=0; ALARM_EL.volume=VOL; ALARM_EL.play().catch(()=>{}); }catch(e){} }, i*1500);
      }
    }
  }catch(e){}
  // Canal 2 : WebAudio en renfort (meilleure qualité quand disponible)
  try{
    if(AC&&AC.state==="running"){
      for(let i=0;i<reps;i++){
        const t0=AC.currentTime+i*1.5;
        // Même motif que le canal 1 : 3 bips secs + 1 bip long plus aigu
        [[392.00,0.00,0.13],[523.25,0.15,0.13],[659.25,0.30,0.52]].forEach(([freq,dt,len])=>{
          [[freq,0.30],[freq*2,0.08],[freq*3,0.03]].forEach(([f,poids])=>{
            const o=AC.createOscillator(), g=AC.createGain();
            o.type="sine"; o.connect(g); g.connect(AC.destination);
            o.frequency.setValueAtTime(f,t0+dt);
            g.gain.setValueAtTime(0.0001,t0+dt);
            g.gain.exponentialRampToValueAtTime(poids*VOL,t0+dt+0.02);
            g.gain.setValueAtTime(poids*VOL,t0+dt+len*0.65);
            g.gain.exponentialRampToValueAtTime(0.0001,t0+dt+len+0.05);
            o.start(t0+dt); o.stop(t0+dt+len+0.07);
          });
        });
      }
    }
  }catch(e){}
  // Canal 3 : notification système — sonne/vibre même appli réduite (limité par iOS si l'appli est totalement fermée)
  if(notifTitle) notifyRing(notifTitle,notifBody);
  try{ if(navigator.vibrate) navigator.vibrate(reps>1?[300,150,300,150,400]:[300]); }catch(e){}
}

function stopTimer(){

  if(TIMER.int){ clearInterval(TIMER.int); TIMER.int=null; }
  if(TIMER.exId){
    const b=document.getElementById("tmr-"+TIMER.exId);
    if(b){ b.textContent=b.dataset.label; b.classList.remove("run"); }
    TIMER.exId=null;
  }

function startTimer(exId,secs,label){
  if(TIMER.exId===exId){ stopTimer(); return; } // 2e appui = annuler
  stopTimer();
  unlockAudio();
  TIMER.exId=exId; TIMER.total=secs; TIMER.label=label||"";
  TIMER.end=Date.now()+secs*1000; // horloge réelle : fiable même écran verrouillé
  garderActif();
  schedulePush("⏱ Repos terminé",TIMER.label||"C'est reparti !",secs);
  const paintPill=left=>{ const bb=document.getElementById("tmr-"+exId);
    if(bb){ bb.textContent="⏱ "+Math.floor(left/60)+":"+String(left%60).padStart(2,"0"); bb.classList.add("run"); } };
  paintPill(secs);
  paintBigTimer(secs,secs,TIMER.label,true);
  wakeOn();
  TIMER.int=setInterval(()=>{
    const left=Math.max(0,Math.round((TIMER.end-Date.now())/1000));
    paintPill(left);
    paintBigTimer(left,TIMER.total,TIMER.label,false);
    if(left<=0){
      clearInterval(TIMER.int); TIMER.int=null;
      const bb=document.getElementById("tmr-"+exId); if(bb){ bb.textContent=bb.dataset.label; bb.classList.remove("run"); }
      TIMER.exId=null;
      alarm(1,"⏱ Repos terminé",TIMER.label||"C'est reparti !");
      voixGo("C'est parti !");
      paintBigTimerDone(TIMER.label);
    }
  },500);
}

/* forfait : séances restantes */
function forfaitRestant(c){
  if(!c.forfaitTotal) return null;
  const done=(c.seances||[]).filter(s=>s.fait).length;
  return Math.max(0, c.forfaitTotal - done);
}



/* compresse une image avant envoi (max 900px, jpeg) */
function compressImage(file, cb){
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=900;
      let w=img.width,h=img.height;
      if(w>MAX||h>MAX){ const k=MAX/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      const ctx=cv.getContext("2d");
      ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h);   // fond blanc : évite le noir sur les PNG transparents
      ctx.drawImage(img,0,0,w,h);
      try{ cb(cv.toDataURL("image/jpeg",0.72)); }catch(e){ cb(null); }
    };
    img.onerror=()=>cb(null);
    img.src=ev.target.result;
  };
  // Sans ce onerror, un échec de lecture ne rappelait JAMAIS cb : la photo
  // disparaissait sans le moindre message d'erreur.
  reader.onerror=()=>cb(null);
  try{ reader.readAsDataURL(file); }catch(e){ cb(null); }
}

/* ===== MESSAGES VOCAUX ===== */
const REC={media:null,rec:null,chunks:[],timer:null,secs:0,role:'coach',startTs:0};
const VOICE_MAX=300;         // 5 minutes
const VOICE_BITRATE=14000;   // 14 kbps mono, suffisant pour la voix, très léger

async function toggleVoice(role){
  const btn=document.getElementById("rec-btn");
  if(REC.rec&&REC.rec.state==="recording"){
    // On force un dernier chunk avant l'arrêt (contourne certains bugs iOS)
    try{ REC.rec.requestData(); }catch(_){}
    setTimeout(()=>{ try{ REC.rec.stop(); }catch(_){} },50);
    return;
  }
  try{
    REC.role=role;
    // Réutilisation du flux micro : couper les pistes après chaque vocal détruisait
    // l'autorisation, et iOS la redemandait à l'enregistrement suivant. On garde le
    // flux ouvert tant qu'il est vivant, et on le libère après 2 min d'inactivité
    // pour ne pas laisser l'indicateur micro allumé indéfiniment.
    const fluxVivant=REC.media && REC.media.getTracks().some(t=>t.readyState==="live");
    if(!fluxVivant){
      // Mono + réduction de bruit : moitié moins lourd, sans perte de clarté sur la voix
      REC.media=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    }
    if(REC.releaseTO){ clearTimeout(REC.releaseTO); REC.releaseTO=null; }
    // Préférer mp4/AAC (iOS natif) puis webm/opus (Chrome, Firefox, Android)
    const prefs=["audio/mp4;codecs=mp4a.40.2","audio/mp4","audio/webm;codecs=opus","audio/webm"];
    let mime=""; for(const mm of prefs){ if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(mm)){ mime=mm; break; } }
    REC.rec=new MediaRecorder(REC.media, mime?{mimeType:mime,audioBitsPerSecond:VOICE_BITRATE}:{audioBitsPerSecond:VOICE_BITRATE});
    REC.chunks=[]; REC.secs=0; REC.startTs=Date.now();
    REC.rec.ondataavailable=e=>{ if(e.data&&e.data.size) REC.chunks.push(e.data); };
    REC.rec.onstop=()=>{
      clearInterval(REC.timer);
      // On ne coupe plus le micro tout de suite : on le libère après 2 min sans
      // nouvel enregistrement, pour éviter une redemande d'autorisation à chaque vocal.
      if(REC.releaseTO) clearTimeout(REC.releaseTO);
      REC.releaseTO=setTimeout(()=>{
        try{ if(REC.media) REC.media.getTracks().forEach(t=>t.stop()); }catch(_){}
        REC.media=null; REC.releaseTO=null;
      },120000);
      const blob=new Blob(REC.chunks,{type:REC.rec.mimeType||"audio/webm"});
      const dureeMs=Date.now()-(REC.startTs||Date.now());
      if(btn){ btn.textContent="🎤"; btn.classList.remove("rec-on","rec-warn"); btn.style.background=""; btn.style.color=""; }
      try{ console.log("[Vocal] durée:",Math.round(dureeMs/1000)+"s","taille:",Math.round(blob.size/1024)+"KB","mime:",blob.type,"chunks:",REC.chunks.length); }catch(_){}
      if(blob.size<800){ toast("Vocal trop court"); return; }
      const reader=new FileReader();
      reader.onload=ev=>{
        const c=sel(); if(!c) return;
        c.messages=c.messages||[];
        c.messages.push({from:REC.role,audio:ev.target.result,date:new Date().toISOString(),lu:REC.role==="coach",dur:Math.round(dureeMs/1000)});
        // La notification part UNIQUEMENT une fois l'envoi confirmé. Un vocal pèse
        // plusieurs centaines de Ko : la push arrivait avant la fin de l'écriture,
        // le destinataire ouvrait l'app et le message n'était pas encore en base.
        patchField(c,"messages",err=>{
          if(err){ toast("Erreur envoi"); return; }
          toast("Vocal envoyé");
          try{
            if(REC.role==="coach"){ pushTo(c.clientEmail,"🎤 Message vocal de ton coach","Nouveau vocal reçu"); }
            else { pushTo(coachEmail(),"🎤 "+((c.nom||"Client").split(" ")[0])+" t'a envoyé un vocal","Nouveau vocal reçu"); }
          }catch(_){}
        });
        render();
        msgVersLeBas(true);
      };
      reader.readAsDataURL(blob);
    };
    // Timeslice de 1s : force la collecte régulière de chunks
    // (contourne des bugs vus sur iOS Safari où de longs enregistrements perdaient des samples)
    REC.rec.start(1000);
    const fmtRec=n=>Math.floor(n/60)+":"+String(n%60).padStart(2,"0");
    if(btn){ btn.textContent="◼ 0:00"; btn.classList.add("rec-on"); }
    REC.timer=setInterval(()=>{
      REC.secs++;
      const b=document.getElementById("rec-btn");
      const reste=VOICE_MAX-REC.secs;
      if(b){
        b.textContent="◼ "+fmtRec(REC.secs);
        b.classList.toggle("rec-warn",reste<=20);
        if(reste===20) toast("20 secondes restantes");
      }
      if(REC.secs>=VOICE_MAX && REC.rec.state==="recording"){
        try{ REC.rec.requestData(); }catch(_){}
        setTimeout(()=>{ try{ REC.rec.stop(); }catch(_){} },50);
        toast("Durée maximale atteinte — vocal envoyé");
      }
    },1000);
  }catch(e){
    console.error("[Vocal] Erreur enregistrement:",e);
    alert("Micro inaccessible : autorisez le micro dans votre navigateur.");
  }
}

/* ===== LECTURE DES VOCAUX =====
   Les data:URL audio posent problème sur iOS Safari : impossible de seek au-delà
   de la portion mise en cache, ce qui fait couper la lecture au bout de quelques
   secondes. On convertit chaque data:URL en Blob URL (streaming natif du navigateur)
   au moment du rendu. Cache pour éviter de recréer les URL à chaque render.
*/
const AUDIO_URL_CACHE=new Map();
function audioSrcFor(dataUrl){
  if(!dataUrl) return "";
  if(!dataUrl.startsWith("data:")) return dataUrl; // déjà une URL classique
  if(AUDIO_URL_CACHE.has(dataUrl)) return AUDIO_URL_CACHE.get(dataUrl);
  try{
    const virgule=dataUrl.indexOf(",");
    const meta=dataUrl.slice(0,virgule);
    const b64=dataUrl.slice(virgule+1);
    const mimeMatch=meta.match(/data:([^;]+)/);
    const mime=mimeMatch?mimeMatch[1]:"audio/webm";
    const bin=atob(b64);
    const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([arr],{type:mime}));
    AUDIO_URL_CACHE.set(dataUrl,url);
    return url;
  }catch(_){ return dataUrl; }
}

/* ===== CORRECTIF DURÉE WEBM (fallback) =====
   Les vocaux enregistrés via MediaRecorder au format WebM n'ont pas leur durée écrite
   dans l'en-tête. Résultat : <audio>.duration = Infinity et la lecture s'arrête souvent
   au bout de quelques secondes. Astuce éprouvée : on seek très loin pour forcer le
   navigateur à parcourir tout le flux et découvrir la vraie fin, puis on remet à 0.
   (Utile en complément de la conversion Blob URL, notamment sur Chrome desktop.)
*/
function fixAudioDuration(audio){
  if(!audio||audio.dataset.fixed==="done") return;
  const setLabel=()=>{
    const l=audio.parentElement&&audio.parentElement.querySelector('.voice-dur');
    if(l&&isFinite(audio.duration)&&audio.duration>0){
      const d=audio.duration;
      l.textContent=Math.floor(d/60)+":"+String(Math.round(d%60)).padStart(2,"0");
    }
  };
  if(isFinite(audio.duration)&&audio.duration>0){ audio.dataset.fixed="done"; setLabel(); return; }
  if(audio.dataset.fixed==="pending") return;
  audio.dataset.fixed="pending";
  const wasPlaying=!audio.paused;
  if(wasPlaying) audio.pause();
  const onSeeked=()=>{
    audio.removeEventListener("timeupdate",onSeeked);
    audio.removeEventListener("seeked",onSeeked);
    try{ audio.currentTime=0; }catch(_){}
    audio.dataset.fixed="done";
    setLabel();
    if(wasPlaying){ audio.play().catch(()=>{}); }
  };
  audio.addEventListener("timeupdate",onSeeked,{once:true});
  audio.addEventListener("seeked",onSeeked,{once:true});
  try{ audio.currentTime=1e101; }catch(_){ audio.dataset.fixed=""; }
}

/* Position de lecture dans la conversation.

   s'il a remonté pour relire, on ne bouge pas sous ses yeux. */
let MSG_ENBAS=true, MSG_NOUVEAUX=0, MSG_AUTO=false;
function msgEstEnBas(ml){ return !ml || (ml.scrollHeight-ml.scrollTop-ml.clientHeight)<60; }
function msgVersLeBas(force){
  const aller=()=>{
    const ml=document.getElementById("msg-list"); if(!ml) return;
    if(!(force||MSG_ENBAS)) return;
    MSG_AUTO=true;
    const avant=ml.style.scrollBehavior;
    ml.style.scrollBehavior="auto";
    ml.scrollTop=ml.scrollHeight;
    ml.style.scrollBehavior=avant||"";
    MSG_ENBAS=true; MSG_NOUVEAUX=0;
    setTimeout(()=>{ MSG_AUTO=false; },60);
  };

  setTimeout(aller,220);
}
function msgSurveiller(){
  const ml=document.getElementById("msg-list"); if(!ml||ml.dataset.veille) return;
  ml.dataset.veille="1";
  ml.addEventListener("scroll",()=>{
    if(MSG_AUTO) return;                 // repositionnement automatique : ce n'est pas l'utilisateur
    MSG_ENBAS=msgEstEnBas(ml);
    const b=document.getElementById("msg-newbtn");
    if(MSG_ENBAS){ MSG_NOUVEAUX=0; if(b) b.style.display="none"; }
  },{passive:true});

function jourSepar(d){
  const x=new Date(d), au=new Date(), hier=new Date(Date.now()-864e5);
  const sameDay=(a,b2)=>a.toDateString()===b2.toDateString();
  if(sameDay(x,au)) return "Aujourd'hui";
  if(sameDay(x,hier)) return "Hier";
  return x.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
}
function messagesTab(c,isCoach){
  // Ordre chronologique garanti : le plus ancien en haut, le plus récent en bas
  const msgs=(c.messages||[]).slice().sort((a,b2)=>new Date(a.date||0)-new Date(b2.date||0));
  let dernierJour="";
  const rows=msgs.length
    ? msgs.map((m,i)=>{
        const j=m.date?jourSepar(m.date):"";
        const sep=(j&&j!==dernierJour)?`<div class="msg-day"><span>${esc(j)}</span></div>`:"";
        if(j) dernierJour=j;
        const suite=i>0&&msgs[i-1].from===m.from;   // messages consécutifs du même auteur
        // Le coach gère le fil de son client : il peut tout supprimer.
        // Le client ne peut retirer que ses propres messages.
        const peutSuppr=isCoach||m.from==="client";
        const btnSuppr=peutSuppr?`<button class="msg-del" data-act="del-msg" data-d="${esc(m.date||"")}" title="Supprimer ce message">×</button>`:"";
        return sep+`<div class="msg ${m.from==='coach'?'coach':'client'}${suite?" suite":""}">
        ${btnSuppr}
        ${m.audio?`<div class="voice-msg">
          <audio controls preload="auto" src="${audioSrcFor(m.audio)}" style="width:100%;height:38px" onloadedmetadata="fixAudioDuration(this)" ondurationchange="fixAudioDuration(this)" onplay="fixAudioDuration(this)"></audio>
          <span class="voice-dur">${m.dur?Math.floor(m.dur/60)+":"+String(Math.round(m.dur%60)).padStart(2,"0"):"🎤"}</span>
        </div>`:m.image?`<img src="${m.image}" data-act="view-img" alt="Photo" style="max-width:100%;border-radius:10px;cursor:pointer;display:block">${m.text?`<div style="margin-top:6px">${esc(m.text)}</div>`:""}`:(m.text?esc(m.text):`<span style="color:var(--grey2);font-style:italic;font-size:12.5px">🎤 Vocal indisponible</span>`)}
        <div class="mt">${msgWhen(m.date)}${m.from==='coach'?`<span class="mt-lu">${m.lu===false?"":"✓"}</span>`:""}</div>
      </div>`;}).join("")
    : vide("✉","Pas encore de message","Écris le premier message ci-dessous.");
  // Position de lecture : on descend seulement si l'utilisateur était déjà en bas.
  // Deux passes : la seconde rattrape la hauteur finale (images, lecteurs audio chargés après coup).
  const placer=()=>{
    const ml=document.getElementById("msg-list"); if(!ml) return;

    if(!MSG_ENBAS) return;

  setTimeout(placer,20);

  const role=isCoach?'coach':'client';
  return `<div class="msg-list" id="msg-list">${rows}</div>
    ${!S.isClient?`<div style="text-align:right;margin-bottom:6px"><button class="link" data-act="msg-tpl" style="font-size:12.5px;padding:2px 0">⚡ Message type</button></div>`:""}
    <div class="msg-input" style="display:block">
      ${S.msgPhoto?`<div style="position:relative;display:inline-block;margin-bottom:8px">
        <img src="${S.msgPhoto}" alt="Photo à envoyer" style="max-height:120px;max-width:100%;border-radius:10px;border:1px solid var(--red);display:block">
        <button data-act="drop-msg-photo" title="Retirer la photo" style="position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:16px;line-height:1;cursor:pointer">×</button>

/* ===== NUTRITION (estimation Mifflin-St Jeor + repères généraux) ===== */
const ACTIVITES=[["sedentaire","Sédentaire — NAP 1,4",1.4],["leger","Peu actif (1-2 séances/sem) — NAP 1,6",1.6],["modere","Actif (3-4 séances/sem) — NAP 1,8",1.8],["actif","Très actif (5-6 séances/sem) — NAP 2,0",2.0],["intense","Athlète / physique intense — NAP 2,2",2.2]];
const OBJ_NUT=[["perte","Perte de poids"],["maintien","Maintien / recomposition"],["prise","Prise de masse"]];
const RYTHMES=[["progressif","Progressif (confort, long terme)"],["standard","Standard (recommandé)"],["rapide","Rapide (court terme, encadré)"],["seche","Sèche extrême (événement, 4-6 sem max)"],["peak","Peak — dernière ligne droite (7-14 jours)"]];
function nutriInfo(c){
  const n=c.nutrition||{};
  const ms=(c.mesures||[]).filter(m=>typeof m.poids==="number");
  const poids=ms.length?ms[ms.length-1].poids:null;
  const taille=c.tailleCm;
  if(!n.sexe||!n.age||!n.activite||!n.objectif||!poids||!taille) return null;
  // 1. Métabolisme de base — Black et al. 1996 (référence ANSES / cours CQP)
  const t_m=taille/100;
  const mj=(n.sexe==="H"?1.083:0.963)*Math.pow(poids,0.48)*Math.pow(t_m,0.50)*Math.pow(n.age,-0.13);
  const bmr=Math.round(mj*239);
  const act=ACTIVITES.find(a=>a[0]===n.activite);
  const tdee=Math.round(bmr*(act?act[2]:1.6));
  // 2. Ajustement en kcal ABSOLUES bornées (pas un simple %) selon le rythme choisi
  const rythme=n.rythme||"standard";
  const R={
    perte:{progressif:[0.10,250,450],standard:[0.175,350,650],rapide:[0.25,500,900],seche:[0.325,700,1100]},
    prise:{progressif:[0.07,150,300],standard:[0.12,250,450],rapide:[0.18,400,700]}
  };
  let delta=0, kcalkg=null;
  if(n.objectif==="perte"&&rythme==="peak"){
    // Protocole fin de prep (type PSMF) : 20 kcal/kg, déficit ≥900 (cap 1800)
    let c2=Math.round(Math.min(tdee-900, poids*20));
    if(tdee-c2>1800) c2=tdee-1800;
    delta=c2-tdee; kcalkg=+(c2/poids).toFixed(1);
  } else if(n.objectif==="perte"&&rythme==="seche"){
    // Méthode prep : 25 kcal/kg, déficit garanti d'au moins 700 kcal (max 1500)
    let c2=Math.round(Math.min(tdee-700, poids*25));
    if(tdee-c2>1500) c2=tdee-1500;
    delta=c2-tdee; kcalkg=+(c2/poids).toFixed(1);
  } else if(n.objectif==="perte"){ const[p,mn,mx]=R.perte[rythme]||R.perte.standard; delta=-Math.round(Math.min(mx,Math.max(mn,tdee*p))); }
  if(n.objectif==="prise"){ const[p,mn,mx]=R.prise[rythme]||R.prise.standard; delta=Math.round(Math.min(mx,Math.max(mn,tdee*p))); }
  let cible=tdee+delta;
  // 3. Plancher de sécurité clinique
  const plancher=n.sexe==="H"?1500:1200;
  let floored=false;
  if(cible<plancher){ cible=plancher; floored=true; delta=cible-tdee; }
  // 4. Rythme de variation estimé (7700 kcal ≈ 1 kg)
  const rate=+(Math.abs(delta)*7/7700).toFixed(2);
  // 5. Macros pro : protéines g/kg selon phase (ISSN), lipides 27,5% kcal (plancher 0,6 g/kg), glucides = solde
  const gkg=n.objectif==="perte"?(rythme==="peak"?2.8:rythme==="seche"?2.5:2.2):n.objectif==="prise"?2.0:1.8;
  const prot_g=Math.min(260,Math.round(poids*gkg));
  let lip_g=Math.round(cible*0.275/9);
  const lipMin=Math.round(poids*0.6);
  if(lip_g<lipMin) lip_g=lipMin;
  const gluc_g=Math.max(0,Math.round((cible-prot_g*4-lip_g*9)/4));
  const pctP=Math.round(prot_g*4/cible*100), pctL=Math.round(lip_g*9/cible*100);
  const pctG=Math.max(0,100-pctP-pctL);
  return {bmr,tdee,cible,delta,rate,floored,prot_g,lip_g,gluc_g,pctP,pctL,pctG,gkg,kcalkg,objectif:n.objectif,rythme};
}
function nutriReperes(obj){
  const communs=["De l'eau tout au long de la journée (1,5 à 2 L)","Des légumes à chaque repas (la moitié de l'assiette)","Une source de protéines à chaque repas, répartie sur la journée","Féculents complets plutôt que raffinés","Limiter les produits ultra-transformés et les boissons sucrées"];
  if(obj==="perte") return communs.concat(["Privilégier les aliments rassasiants à faible densité calorique (légumes, protéines maigres)","Attention aux calories liquides (sodas, alcool, jus)","Déficit modéré : la régularité prime sur la restriction"]);
  if(obj==="prise") return communs.concat(["Augmenter la densité calorique saine : oléagineux, huile d'olive, avocat","Ajouter 1 à 2 collations (ex. fruits + amandes, laitage + flocons)","Manger autour des séances pour soutenir l'entraînement"]);
  return communs.concat(["Assiette équilibrée : ½ légumes, ¼ protéines, ¼ féculents","Écouter la satiété : manger lentement, sans écran"]);
}

/* Remplacements choisis (par le coach ou le client) : {idOrigine:idRemplacant} */
function getSwaps(c){ return (c.nutrition&&c.nutrition.swaps)||{}; }

function nutriMenu(c){
  const info=nutriInfo(c); if(!info) return null;
  const nsel=(c.nutrition&&c.nutrition.menu)||1;
  const base=MENUS[Math.min(MENUS.length,Math.max(1,nsel))-1];
  const supp=!!(c.nutrition&&c.nutrition.supplements==="oui");
  // Variante suppléments : collation → shaker whey, + caséine avant le coucher
  let repasDef=base.repas;
  if(supp){
    repasDef=base.repas.map(r2=>r2.t==="Collation"
      ?{t:"Collation (post-entraînement)",items:[["whey",30],["banane",100]]}
      :r2);
    repasDef=repasDef.concat([{t:"Avant le coucher",items:[["caseine",30]]}]);
  }
  const menu={nom:base.nom+(supp?" + suppléments":""),repas:repasDef};
  // Échelle calée sur le total RÉEL de base du menu (plus juste que /2000)
  const kcalOf=(id,q)=>{const a=ALIMENTS[id];return a.u?a.k*q:a.k*q/100;};
  const baseTotal=menu.repas.reduce((t,r2)=>t+r2.items.reduce((t2,[id,q])=>t2+kcalOf(id,q),0),0);
  const kf=info.cible/baseTotal;
  let totJ=0;
  const swaps=getSwaps(c);
  const repas=menu.repas.map(r2=>{
    let tot=0;
    const items=r2.items.map(([id,base])=>{
      // Remplacement éventuel : on vise les MÊMES calories que l'aliment d'origine
      const origA=ALIMENTS[id];
      const newId=(swaps[id]&&ALIMENTS[swaps[id]])?swaps[id]:id;
      const a=ALIMENTS[newId];
      const kcalCible=(origA.u?origA.k*base:origA.k*base/100)*kf;
      let q,label,kcal;
      if(a.u){ q=Math.max(1,Math.round(kcalCible/a.k)); kcal=Math.round(a.k*q); label=q+" "+a.n.toLowerCase()+(q>1?"s":""); }
      else{ q=Math.max(5,Math.round(kcalCible/a.k*100/5)*5); kcal=Math.round(a.k*q/100); label=a.n+" — "+q+(a.ml?" ml":" g"); }
      tot+=kcal;
      return {label,kcal,id,newId,swapped:newId!==id};
    });
    totJ+=tot;
    return {t:r2.t,items,tot};
  });
  return {nom:menu.nom,repas,total:totJ,cible:info.cible,sel:nsel};
}

/* Identifiant YouTube d'un exercice (null si le lien n'est pas YouTube) */
function ytId(e){

/* Ouvre la vidéo DANS l'appli, sans quitter la séance */
function playVideo(nom,id,lien){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:240;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))";
  ov.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px">
      <span style="color:var(--white);font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(nom||"Vidéo")}</span>
      <span id="vid-rest" style="display:none;flex:0 0 auto;background:rgba(206,42,42,.18);color:#FF6B6B;border:1px solid rgba(206,42,42,.4);font-family:'Bebas Neue';font-size:17px;letter-spacing:.05em;padding:3px 12px;border-radius:999px">—</span>
      <button class="x" data-close-vid style="font-size:26px;flex:0 0 auto">×</button>
    </div>
    <div style="flex:1;display:flex;align-items:center;justify-content:center;min-height:0">
      ${id
        ?`<div style="width:100%;max-width:820px;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line)">
            <iframe src="https://www.youtube.com/embed/${esc(id)}?autoplay=1&rel=0&playsinline=1" style="width:100%;height:100%;border:0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
          </div>`
        :`<div style="text-align:center;color:var(--white2);font-size:14px;line-height:1.6;max-width:340px">
            Cette vidéo ne peut pas être lue directement dans l'appli.<br>
            <a href="${esc(lien)}" target="_blank" rel="noopener" style="color:var(--red);font-weight:700">Ouvrir dans le navigateur ›</a>
          </div>`}
    </div>
    ${id?`<div style="text-align:center;margin-top:12px"><a href="${esc(lien)}" target="_blank" rel="noopener" style="color:var(--grey);font-size:12.5px">Ouvrir sur YouTube ›</a></div>`:""}`;
  // Si un repos est en cours, on affiche un badge compteur qui se met à jour toutes les 500ms
  // et on ferme automatiquement la modale à la fin du repos.
  let vidTimer=null;
  const cleanup=()=>{ if(vidTimer){ clearInterval(vidTimer); vidTimer=null; } ov.remove(); };
  if(typeof WK!=="undefined" && WK.on && WK.restEnd && WK.rest>0){
    const badge=ov.querySelector("#vid-rest");
    if(badge){
      badge.style.display="inline-block";
      const tick=()=>{
        const restSec=Math.max(0,Math.round((WK.restEnd-Date.now())/1000));
        badge.textContent=Math.floor(restSec/60)+":"+String(restSec%60).padStart(2,"0");
        badge.style.color=restSec<=10?"#F0B429":"#FF6B6B";
        if(restSec<=0){
          // Fin du repos : on ferme la vidéo, l'alarme normale se déclenche dans wkStartRest
          cleanup();
        }
      };
      tick();
      vidTimer=setInterval(tick,500);
    }
  }
  ov.addEventListener("click",ev=>{ if(ev.target===ov||ev.target.closest("[data-close-vid]")) cleanup(); });
  document.body.appendChild(ov);
}

  // Élastique et HIIT sont utiles dans les deux modes : en salle comme à la maison
  const groups=mode==="maison"?EXOS_MAISON.concat(hiitGroup()):EXOS_GROUPES.concat(elasticGroup(),hiitGroup());
  const q=normTxt(filter);
  let html=`<option value="">${q?"— Résultats —":"— Parcourir par groupe musculaire —"}</option>`;
  if(!q){
    const rec=recentExos();
    if(rec.length) html+=`<optgroup label="⭐ Récemment utilisés">${rec.map(e=>`<option value="${esc(e)}">${esc(e)}</option>`).join("")}</optgroup>`;
  }
  groups.forEach(([g,list])=>{
    const f=q?list.filter(e=>normTxt(e).includes(q)):list;
    if(f.length) html+=`<optgroup label="${g}">${f.map(e=>`<option value="${esc(e)}">${esc(e)}</option>`).join("")}</optgroup>`;
  });
  return html;
}
function pickerCount(mode,filter){
  const groups=mode==="maison"?EXOS_MAISON.concat(hiitGroup()):EXOS_GROUPES.concat(elasticGroup(),hiitGroup());
  const q=normTxt(filter);
  return groups.reduce((t2,g)=>t2+(q?g[1].filter(e=>normTxt(e).includes(q)).length:g[1].length),0);
}
/* Résultats à plat, cliquables directement */
function pickerResults(mode,filter){
  const q=normTxt(filter); if(!q) return [];
  const groups=mode==="maison"?EXOS_MAISON.concat(hiitGroup()):EXOS_GROUPES.concat(elasticGroup(),hiitGroup());
  const out=[];
  groups.forEach(([g,list])=>list.forEach(e=>{ if(normTxt(e).includes(q)) out.push({nom:e,grp:g}); }));
  return out.slice(0,60);
}

function renderExoResults(wrap){
  if(!wrap) return;
  const fEl=wrap.querySelector("[data-exofilter]");
  const box=wrap.querySelector(".exo-results");
  const browse=wrap.querySelector(".exo-browse");
  if(!fEl||!box) return;
  const q=fEl.value, mode=S.exoMode||"salle";
  const hits=pickerResults(mode,q);
  if(!normTxt(q)){
    box.style.display="none"; box.innerHTML="";
    if(browse) browse.style.display="";
    return;
  }
  if(browse) browse.style.display="none";
  box.style.display="block";
  box.innerHTML=hits.length
    ? hits.map(h=>`<button type="button" class="exo-hit" data-exohit="${esc(h.nom)}" data-target="${esc(fEl.dataset.exofilter)}" style="display:flex;align-items:center;gap:10px"><span style="flex:0 0 auto">${exoIcon(h.nom,20)}</span><span style="flex:1;min-width:0">${esc(h.nom)}<span class="g">${esc(h.grp)}</span></span></button>`).join("")
    : `<div style="padding:12px;font-size:13.5px;color:var(--grey)">Aucun exercice trouvé. Tu peux quand même le saisir librement dans le champ ci-dessous.</div>`;
}

function imcInfo(c){
  const ms=c.mesures||[];
  const poids=ms.length?ms[ms.length-1].poids:null;
  const t=c.tailleCm;
  if(!poids||!t) return null;
  const imc=+(poids/Math.pow(t/100,2)).toFixed(1);
  let cat="Corpulence normale", col="#4CAF50";
  if(imc<18.5){cat="Insuffisance pondérale";col="var(--amber)";}
  else if(imc>=30){cat="Obésité";col="var(--red)";}
  else if(imc>=25){cat="Surpoids";col="var(--amber)";}
  return {imc,cat,col,poids,taille:t};
}
function bilanTab(c,editable){
  const info=imcInfo(c);
  const imcCard=info
    ? `<div class="pstats"><div class="pstat"><div class="pv">${info.imc}</div><div class="pl">IMC</div></div>
       <div class="pstat" style="flex:2"><div class="pv" style="font-size:15px;color:${info.col}">${info.cat}</div><div class="pl">${info.poids} kg · ${info.taille} cm</div></div></div>`
    : `<div class="chart-empty" style="margin-bottom:12px">Renseignez la taille (onglet Infos) et au moins un poids (onglet Progrès) pour calculer l'IMC.</div>`;

  const bilans=c.bilans||[];
  const F=[["taille","Tour de taille"],["brasD","Bras droit"],["brasG","Bras gauche"],["cuisseD","Cuisse droite"],["cuisseG","Cuisse gauche"]];
  const form=editable?`
    <div class="panel" style="margin-bottom:14px"><div class="ph">Nouveau bilan — ${frDate(today())}</div>
      <div class="r2">
        <label class="fld"><span>Poids (kg)</span><input id="bl-poids" inputmode="decimal" placeholder="72.5"></label>
        <label class="fld"><span>Taille (cm)</span><input id="bl-tcm" inputmode="decimal" placeholder="170" value="${c.tailleCm||''}"></label>
      </div>
      <div class="r2">
        <label class="fld"><span>Tour de taille (cm)</span><input id="bl-taille" inputmode="decimal" placeholder="82"></label>
        <label class="fld"><span>Bras D (cm)</span><input id="bl-brasD" inputmode="decimal" placeholder="32"></label>
        <label class="fld"><span>Bras G (cm)</span><input id="bl-brasG" inputmode="decimal" placeholder="32"></label>
      </div>
      <div class="r2">
        <label class="fld"><span>Cuisse D (cm)</span><input id="bl-cuisseD" inputmode="decimal" placeholder="55"></label>
        <label class="fld"><span>Cuisse G (cm)</span><input id="bl-cuisseG" inputmode="decimal" placeholder="55"></label>
        <label class="fld"><span>Note</span><input id="bl-note" placeholder="Remarque…"></label>
      </div>
      <button class="btn p full" data-act="add-bilan">Enregistrer le bilan</button></div>`:"";

  const rows=[...bilans].reverse().map((b,ri)=>{
    const idx=bilans.length-1-ri;
    const prev=idx>0?bilans[idx-1]:null;
    const delta=(k)=>{
      if(!prev||prev[k]==null||b[k]==null) return "";
      const d=+(b[k]-prev[k]).toFixed(1);
      if(d===0) return ` <span style="color:var(--grey2);font-size:11px">(=)</span>`;
      return ` <span style="color:${d<0?'#4CAF50':'var(--amber)'};font-size:11px;font-weight:700">(${d>0?'+':''}${d})</span>`;
    };
    const poidsLine=b.poids!=null?`Poids : <b>${b.poids} kg</b>${delta('poids')} · `:"";
    const vals=F.filter(([k])=>b[k]!=null).map(([k,l])=>`${l} : <b>${b[k]} cm</b>${delta(k)}`).join(" · ");
    return `<div class="mrow"><div style="flex:1">
      <span class="md" style="margin-left:0;font-weight:700;color:var(--white)">${frDate(b.date)}</span>
      <div class="md" style="margin-left:0">${poidsLine}${vals||(poidsLine?"":"—")}</div>
      ${b.note?`<div class="md" style="margin-left:0;font-style:italic">${esc(b.note)}</div>`:""}</div>
      ${editable?`<button class="x" data-act="del-bilan" data-idx="${idx}">×</button>`:""}</div>`;
  }).join("");

  const printBtn=(editable&&bilans.length)?`<button class="btn g full" style="margin-bottom:14px" data-act="print-bilan">🖨 Imprimer / PDF le bilan</button>`:"";
  return imcCard+form+printBtn+(rows||`<p class="muted" style="margin-bottom:14px">Aucun bilan enregistré.</p>`)
    +`<div class="sec-head" style="margin-top:18px"><h2 style="font-size:16px">Photos</h2>${(c.photos||[]).length>=2?`<button class="link" style="font-size:13px" data-act="toggle-compare">${S.photoCompare?"Masquer":"Avant / Après"}</button>`:""}</div>`
    +((S.photoCompare&&(c.photos||[]).length>=2)?(()=>{
